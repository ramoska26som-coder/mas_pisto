<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1877F2">
<title>Panel de Crédito · Más Pisto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --azul:#1877F2; --azul-oscuro:#0B5AD6; --azul-tinta:#0A2A66;
    --amarillo:#FFD400; --amarillo-oscuro:#E6BE00;
    --cielo:#EAF3FF; --gris:#5B6B82; --linea:#DCE6F5;
    --error:#D63B3B; --error-lt:#FFF0F0;
    --ok:#1F9D57; --ok-lt:#EFFAF3;
    --amber:#B7791F; --amber-lt:#FFF8E6;
    --fondo:#F7FAFF;
    --sombra:0 10px 40px rgba(11,90,214,.12);
    --sombra-sm:0 2px 8px rgba(11,90,214,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--azul-tinta);background:var(--fondo);
    line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:3px solid rgba(24,119,242,.35);outline-offset:1px}
  h1,h2,h3,h4{font-family:'Poppins';letter-spacing:-.3px}
  a{color:var(--azul)}

  /* LOGIN */
  #login{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;
    background:radial-gradient(1100px 600px at 100% -10%,rgba(24,119,242,.10),transparent 60%),
               radial-gradient(900px 500px at -10% 110%,rgba(255,212,0,.10),transparent 55%),var(--fondo)}
  .login-box{width:100%;max-width:380px}
  .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:20px}
  .brand svg{width:44px;height:44px;flex:none}
  .brand .name{font-family:'Poppins';font-weight:800;font-size:26px;color:var(--azul);letter-spacing:-.5px;line-height:1}
  .brand .tag{font-family:'Poppins';font-weight:600;font-size:9.5px;letter-spacing:1.5px;color:var(--gris);margin-top:2px}
  .login-card{background:#fff;border:1px solid var(--linea);border-radius:22px;box-shadow:var(--sombra);overflow:hidden}
  .login-hero{background:linear-gradient(135deg,var(--azul),var(--azul-oscuro));color:#fff;padding:24px 26px;position:relative;overflow:hidden}
  .login-hero::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;
    background:radial-gradient(circle,rgba(255,212,0,.35),transparent 70%);border-radius:50%}
  .login-hero .eyebrow{font-family:'Poppins';font-weight:700;font-size:11px;letter-spacing:2px;color:var(--amarillo);text-transform:uppercase}
  .login-hero h1{font-size:24px;font-weight:800;margin-top:5px}
  .login-body{padding:24px 26px 26px}

  /* LAYOUT */
  #app{display:none;height:100dvh;min-height:0}
  .shell{display:flex;height:100dvh;min-height:0}
  .side{width:232px;flex:none;background:#fff;border-right:1px solid var(--linea);
    display:flex;flex-direction:column;min-height:0;transition:margin-left .22s ease}
  .side.hide{margin-left:-232px}
  .side-top{padding:18px 16px;border-bottom:1px solid var(--linea)}
  .side-brand{display:flex;align-items:center;gap:10px}
  .side-brand svg{width:32px;height:32px;flex:none}
  .side-brand .name{font-family:'Poppins';font-weight:800;font-size:19px;color:var(--azul);line-height:1}
  .side-brand .tag{font-family:'Poppins';font-weight:600;font-size:7.5px;letter-spacing:1.2px;color:var(--gris);margin-top:1px}
  .nav{flex:1;padding:12px 10px;overflow-y:auto}
  .nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;background:none;
    border-radius:11px;cursor:pointer;text-align:left;font-family:'Poppins';font-weight:600;
    font-size:14px;color:var(--gris);margin-bottom:3px}
  .nav-i:hover{background:var(--cielo);color:var(--azul)}
  .nav-i.on{background:var(--azul);color:#fff}
  .nav-i svg{width:18px;height:18px;flex:none}
  .nav-i .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(0,0,0,.08);padding:1px 7px;border-radius:9px}
  .nav-i.on .cnt{background:rgba(255,255,255,.25)}
  .nav-sep{font-family:'Poppins';font-weight:700;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--gris);padding:14px 12px 6px;opacity:.7}
  .side-pie{padding:12px;border-top:1px solid var(--linea)}
  .yo{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:var(--cielo)}
  .yo-av{width:32px;height:32px;border-radius:50%;background:var(--azul);color:#fff;flex:none;
    display:grid;place-items:center;font-family:'Poppins';font-weight:700;font-size:13px}
  .yo-n{font-family:'Poppins';font-weight:600;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .yo-r{font-size:10.5px;color:var(--gris);text-transform:capitalize}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--linea);flex:none}
  .burger{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--linea);background:#fff;
    cursor:pointer;display:grid;place-items:center;flex:none;color:var(--gris)}
  .burger:hover{border-color:var(--azul);color:var(--azul)}
  .top h2{font-size:18px;font-weight:700;flex:1}
  .cont{flex:1;overflow-y:auto;min-height:0;padding:18px;-webkit-overflow-scrolling:touch}
  .cont-in{max-width:960px;margin:0 auto}
  .scrim{position:fixed;inset:0;background:rgba(10,42,102,.4);z-index:80;display:none}
  @media(max-width:820px){
    .side{position:fixed;z-index:90;height:100dvh;box-shadow:var(--sombra)}
    .scrim.on{display:block}
  }

  .chips-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .chips-row::-webkit-scrollbar{display:none}
  .chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--linea);background:#fff;cursor:pointer;
    font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--gris)}
  .chip:hover{border-color:var(--azul)}
  .chip.on{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
  .chip .n{margin-left:6px;font-size:11px;opacity:.85}

  .card{background:#fff;border:1px solid var(--linea);border-radius:16px;box-shadow:var(--sombra-sm);
    padding:16px;margin-bottom:11px;cursor:pointer;transition:border-color .15s,transform .1s}
  .card:hover{border-color:var(--azul)}
  .card:active{transform:scale(.995)}
  .c-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .c-nom{font-family:'Poppins';font-weight:600;font-size:15.5px;line-height:1.25}
  .c-folio{font-size:11.5px;color:var(--azul);font-weight:600;margin-top:2px;letter-spacing:.3px}
  .c-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .tag{font-size:11.5px;padding:3px 9px;border-radius:7px;background:var(--fondo);color:var(--gris);border:1px solid var(--linea)}
  .tag.b{background:var(--cielo);color:var(--azul);border-color:#C7DFFB;font-weight:600}
  .tag.y{background:#FFF8DC;color:#8A6D00;border-color:#F2E08A;font-weight:600}
  .sla{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;flex:none}
  .sla.ok{background:var(--ok-lt);color:var(--ok)}
  .sla.md{background:var(--amber-lt);color:var(--amber)}
  .sla.no{background:var(--error-lt);color:var(--error)}
  .vacio{text-align:center;padding:60px 20px;color:var(--gris)}
  .vacio svg{opacity:.3;margin-bottom:12px}
  .vacio p{font-size:14.5px}

  .modal{position:fixed;inset:0;z-index:100;display:none}
  .modal.on{display:block}
  .modal-bg{position:absolute;inset:0;background:rgba(10,42,102,.45)}
  .modal-b{position:absolute;inset:0;background:var(--fondo);display:flex;flex-direction:column;min-height:0}
  @media(min-width:760px){
    .modal-b{left:50%;transform:translateX(-50%);width:720px;top:20px;bottom:0;
      border-radius:20px 20px 0 0;box-shadow:var(--sombra);overflow:hidden}
  }
  .modal-h{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#fff;border-bottom:1px solid var(--linea);flex:none}
  .modal-h h3{font-size:17px;font-weight:700;line-height:1.2}
  .modal-h .f{font-size:11.5px;color:var(--azul);font-weight:600}
  .modal-s{flex:1;overflow-y:auto;min-height:0;padding:16px;padding-bottom:100px}
  .modal-p{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--linea);display:flex;gap:9px}
  .x{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--linea);background:#fff;cursor:pointer;
    display:grid;place-items:center;flex:none;font-size:15px;color:var(--gris)}
  .x:hover{border-color:var(--error);color:var(--error)}

  .sec{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:18px;margin-bottom:12px}
  .sec-h{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .sec-h h4{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--azul)}
  .badge{margin-left:auto;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:7px}
  .badge.p{background:var(--fondo);color:var(--gris);border:1px solid var(--linea)}
  .badge.k{background:var(--ok-lt);color:var(--ok)}
  .badge.m{background:var(--error-lt);color:var(--error)}
  .badge.a{background:var(--amber-lt);color:var(--amber)}

  .dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px}
  .dl dt{color:var(--gris);white-space:nowrap}
  .dl dd{text-align:right;word-break:break-word;font-weight:500}

  label{display:block;font-family:'Poppins';font-weight:600;font-size:12.5px;margin-bottom:6px}
  label small{display:block;font-family:'Inter';font-weight:400;font-size:11px;color:var(--gris);margin-top:1px}
  input,select,textarea{width:100%;font-size:14.5px;padding:11px 13px;border:1.5px solid var(--linea);
    border-radius:11px;background:#fff;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(24,119,242,.13)}
  input:read-only{background:var(--fondo);color:var(--gris)}
  textarea{resize:vertical;min-height:64px}
  .fld{margin-bottom:13px}
  .fld:last-child{margin-bottom:0}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  @media(max-width:520px){.g2,.g3{grid-template-columns:1fr}}

  .tipo-g{display:flex;gap:7px;flex-wrap:wrap}
  .tipo-g button{flex:1;min-width:96px;padding:10px 8px;border:1.5px solid var(--linea);background:#fff;
    border-radius:11px;cursor:pointer;font-family:'Poppins';font-weight:600;font-size:13px;color:var(--gris)}
  .tipo-g button:hover{border-color:var(--azul)}
  .tipo-g button.on{background:var(--azul);border-color:var(--azul);color:#fff}

  .btn{font-family:'Poppins';font-weight:700;font-size:14.5px;border:none;border-radius:12px;
    padding:13px 18px;cursor:pointer;transition:background .15s,transform .08s}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-y{background:var(--amarillo);color:var(--azul-tinta);box-shadow:0 6px 16px rgba(255,212,0,.35);flex:1}
  .btn-y:hover:not(:disabled){background:var(--amarillo-oscuro)}
  .btn-b{background:var(--azul);color:#fff;box-shadow:0 6px 16px rgba(24,119,242,.3);flex:1}
  .btn-b:hover:not(:disabled){background:var(--azul-oscuro)}
  .btn-g{background:#fff;border:1.5px solid var(--linea);color:var(--gris)}
  .btn-g:hover{border-color:var(--azul);color:var(--azul)}
  .btn-r{background:var(--error);color:#fff;flex:1}
  .btn-sm{padding:8px 13px;font-size:12.5px;border-radius:9px}
  .btn-full{width:100%}

  .row-d{display:grid;grid-template-columns:1fr 140px 40px;gap:9px;align-items:center;margin-bottom:8px}
  @media(max-width:520px){.row-d{grid-template-columns:1fr 100px 40px}}
  .row-d input{padding:9px 11px;font-size:14px}
  .del{border:1.5px solid var(--linea);background:#fff;color:var(--error);border-radius:9px;
    height:40px;cursor:pointer;font-size:19px;line-height:1;font-weight:700}
  .del:hover{background:var(--error-lt);border-color:var(--error)}
  .add{background:var(--cielo);color:var(--azul);border:1.5px dashed var(--azul);border-radius:10px;
    padding:9px 14px;font-family:'Poppins';font-weight:600;font-size:13px;cursor:pointer}
  .add:hover{background:#DFEEFF}

  .paste{width:100%;min-height:96px;font-family:ui-monospace,monospace;font-size:12.5px;
    border:1.5px dashed var(--azul);border-radius:12px;padding:12px;background:var(--cielo);resize:vertical}
  .paste:focus{outline:none;background:#fff;border-style:solid}
  .paste-h{font-size:11.5px;color:var(--gris);margin-top:6px}

  .tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:540px}
  th{font-family:'Poppins';font-weight:600;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;
    color:var(--gris);text-align:left;padding:8px 7px;border-bottom:1.5px solid var(--linea);white-space:nowrap}
  td{padding:7px;border-bottom:1px solid var(--linea);white-space:nowrap}
  td input{padding:6px 8px;font-size:12.5px;border-radius:7px}
  .dd{font-weight:700;text-align:center;padding:3px 8px;border-radius:6px;font-size:12px;display:inline-block;min-width:40px}
  .dd.k{background:var(--ok-lt);color:var(--ok)}
  .dd.a{background:var(--amber-lt);color:var(--amber)}
  .dd.m{background:var(--error-lt);color:var(--error)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:9px}
  .kpi{background:var(--fondo);border:1px solid var(--linea);border-radius:11px;padding:11px;text-align:center}
  .kpi.k{background:var(--ok-lt);border-color:#BFE8CF}
  .kpi.a{background:var(--amber-lt);border-color:#F2E08A}
  .kpi.m{background:var(--error-lt);border-color:#F3C4C4}
  .kpi-v{font-family:'Poppins';font-weight:800;font-size:22px;line-height:1}
  .kpi-l{font-size:10.5px;color:var(--gris);margin-top:3px}

  .ref{background:var(--fondo);border:1px solid var(--linea);border-radius:12px;padding:13px;margin-bottom:9px}
  .ref-t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
  .ref-n{font-family:'Poppins';font-weight:600;font-size:14px}
  .ref-d{font-size:12px;color:var(--gris);margin-top:1px}
  .res-g{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
  .res{flex:1;min-width:72px;padding:8px 4px;border-radius:9px;cursor:pointer;background:#fff;
    border:1.5px solid var(--linea);font-size:11.5px;font-weight:600;color:var(--gris);text-align:center}
  .res:hover{border-color:var(--azul)}
  .res.on[data-r="ok"]{background:var(--ok-lt);border-color:var(--ok);color:var(--ok)}
  .res.on[data-r="no_respondio"]{background:var(--amber-lt);border-color:var(--amber);color:var(--amber)}
  .res.on[data-r="negativa"]{background:var(--error-lt);border-color:var(--error);color:var(--error)}
  .res.on[data-r="falsa"]{background:var(--error);border-color:var(--error);color:#fff}
  .ref textarea{min-height:40px;font-size:13px;padding:8px 10px}

  .veredicto{border-radius:14px;padding:18px;margin-bottom:12px;border:2px solid}
  .veredicto.k{background:var(--ok-lt);border-color:var(--ok)}
  .veredicto.m{background:var(--error-lt);border-color:var(--error)}
  .v-t{font-family:'Poppins';font-weight:800;font-size:18px;margin-bottom:4px}
  .v-d{font-size:13.5px;color:var(--gris);line-height:1.45}
  .v-row{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,0,0,.09)}
  .v-i{flex:1}
  .v-l{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gris)}
  .v-v{font-family:'Poppins';font-weight:800;font-size:24px;line-height:1.1;margin-top:2px}

  .callout{background:var(--cielo);border:1px solid var(--linea);border-radius:12px;padding:13px 15px;font-size:13.5px;margin-bottom:12px}
  .callout.w{background:var(--amber-lt);border-color:#F2E08A}
  .callout.r{background:var(--error-lt);border-color:#F3C4C4}
  .callout b{font-family:'Poppins';font-weight:600}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);
    background:var(--azul-tinta);color:#fff;padding:13px 22px;border-radius:26px;
    font-family:'Poppins';font-weight:600;font-size:13.5px;z-index:300;opacity:0;
    transition:transform .28s cubic-bezier(.2,.8,.3,1),opacity .28s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.k{background:var(--ok)} .toast.m{background:var(--error)}

  .sp{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;animation:g .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes g{to{transform:rotate(360deg)}}
  .hide{display:none!important}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  .u-row{display:flex;align-items:center;gap:11px;padding:13px;background:#fff;border:1px solid var(--linea);
    border-radius:13px;margin-bottom:9px;flex-wrap:wrap}
  .u-av{width:38px;height:38px;border-radius:50%;background:var(--cielo);color:var(--azul);flex:none;
    display:grid;place-items:center;font-family:'Poppins';font-weight:700;font-size:14px}
  .u-i{flex:1;min-width:130px}
  .u-n{font-family:'Poppins';font-weight:600;font-size:14.5px}
  .u-m{font-size:12px;color:var(--gris);word-break:break-all}
  .u-off{opacity:.5}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 46h10V36h-10V25h-10v11H2v10h10v11h10V46z" fill="#1877F2"/>
        <path d="M46 25h30a3 3 0 0 1 3 3v14c0 15-10 25-25 25V57c8 0 14-6 14-15v-7H46V25z" fill="#1877F2"/>
        <rect x="46" y="35" width="10" height="42" rx="1" fill="#1877F2"/>
      </svg>
      <div><div class="name">más pisto</div><div class="tag">FÁCIL, RÁPIDOS Y CONFIABLES</div></div>
    </div>
    <div class="login-card">
      <div class="login-hero">
        <p class="eyebrow">Uso interno</p>
        <h1>Panel de crédito</h1>
      </div>
      <div class="login-body">
        <div class="callout r hide" id="lerr"></div>
        <div class="fld"><label for="email">Correo</label>
          <input id="email" type="email" autocomplete="username" placeholder="vos@maspisto.hn"></div>
        <div class="fld"><label for="pass">Contraseña</label>
          <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
        <button class="btn btn-b btn-full" id="btn-login" style="margin-top:6px">Entrar</button>
      </div>
    </div>
  </div>
</div>

<div id="app">
  <div class="scrim" id="scrim"></div>
  <div class="shell">
    <aside class="side" id="side">
      <div class="side-top">
        <div class="side-brand">

/* ===== MOTOR (portado de analisis-credito.html) ===== */
function calcLimite(prom,tipo,meses){
  if(!prom||prom<=0) return {ok:false,motivo:'Sin ingreso registrado'};
  if(prom<P.minIngreso) return {ok:false,motivo:`El ingreso promedio (${fmtL(prom)}) no alcanza el mínimo de ${fmtL(P.minIngreso)}.`};
  let pct,regla;
  if(tipo==='nuevo'){pct=P.pctNuevo/100;regla=`Nuevo ingreso: ${P.pctNuevo}% del ingreso mensual`;}
  else if(meses>=P.mesAlto){pct=P.pctAlto/100;regla=`Antigüedad ≥${P.mesAlto} meses: ${P.pctAlto}%`;}
  else if(meses>P.mesMedio){pct=P.pctMedio/100;regla=`Antigüedad >${P.mesMedio} meses: ${P.pctMedio}%`;}
  else{pct=P.pctNuevo/100;regla=`Antigüedad ≤${P.mesMedio} meses: ${P.pctNuevo}%`;}
  const red=Math.ceil((prom*pct)/(P.redondeo||1000))*(P.redondeo||1000);
  const fin=Math.min(P.limiteMax,Math.max(P.limiteMin,red));
  return {ok:true,monto:fin,pct,regla,clamped:Math.round(fin)!==Math.round(red)};
}
function calcTasa(tipo,prom,perfil,meses,h){
  let tasa=P.tasaStd,tipoTasa='Estándar',regla='';
  if(tipo==='nuevo'){
    if(prom>=P.ingresoPref&&perfil==='ideal'){tasa=P.tasaPref;tipoTasa='Preferencial';regla=`Nuevo + ≥${fmtL(P.ingresoPref)} + perfil ideal`;}
    else regla=perfil==='riesgo'?'Perfil de riesgo':'Nuevo sin condición preferencial';
    return {tasa,tipoTasa,regla};
  }
  if(prom>=P.ingresoPref&&perfil==='ideal'){tasa=P.tasaPref;tipoTasa='Preferencial';regla=`≥${fmtL(P.ingresoPref)} + perfil ideal`;}
  else regla=perfil==='riesgo'?'Perfil de riesgo':'Sin condición preferencial';
  const hh=h||{ok:0,late:0,maxDias:0};
  const grave=hh.maxDias>=P.spDiasGrave;
  const cumple=!grave&&hh.late<=P.spMaxLeves;
  if(perfil!=='riesgo'&&meses>=P.spAntig&&hh.ok>=P.spCuotas&&cumple){
    const prev=tasa;tasa=tasa===P.tasaStd?P.tasaPref:P.tasaSuper;tipoTasa='Súper Preferencial';
    regla+=` → ≥${P.spAntig}m + ≥${P.spCuotas} buenos + ≤${P.spMaxLeves} leves + 0 graves: ${prev}% → ${tasa}%`;
  }else if(perfil!=='riesgo'&&meses>=P.spAntig&&hh.ok>=P.spCuotas&&!cumple){
    regla+=grave?` · No aplica preferencial (tardío de ${hh.maxDias}d)`
                :` · No aplica preferencial (${hh.late} tardíos, máx ${P.spMaxLeves})`;
  }
  return {tasa,tipoTasa,regla};
}
function analizarCuotas(cs){
  let ok=0,late=0,maxDias=0,total=0;
  (cs||[]).forEach(c=>{
    c._dias=null;
    if(!c.pactada||!c.pagada) return;
    total++;
    const d=Math.round((new Date(c.pagada+'T12:00:00')-new Date(c.pactada+'T12:00:00'))/864e5);
    c._dias=d;
    if(d>P.diasTarde){late++;maxDias=Math.max(maxDias,d);} else ok++;
  });
  return {ok,late,maxDias,total};
}

function sla(s){

  const t=m<60?m+'m':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'d';
  return `<span class="sla ${cls}">${t}</span>`;
}

    </div>
    <button class="btn btn-g btn-sm" id="h-csv">Descargar CSV</button></div>

  const render=()=>{
    const q=($('#h-q').value||'').toLowerCase().trim(), e=$('#h-e').value;

    });
    $('#h-list').innerHTML=f.length?f.map(s=>{
      const d=s.datos_cliente||{},r=s.resultado_analisis||{};
      const cl={aprobado:'k',denegado:'m',desembolsado:'k'}[s.estado];
      return `<div class="card" data-id="${s.id}">
        <div class="c-top"><div style="min-width:0">
          <div class="c-nom">${esc(nombreDe(d))}</div>
          <div class="c-folio">${esc(s.folio)} · ${new Date(s.cerrado_en||s.actualizado_en).toLocaleDateString('es-HN')}</div>
        </div><span class="badge ${cl}" style="margin:0">${ETQ[s.estado]}</span></div>
        <div class="c-meta"><span class="tag">${TIPO_L[s.tipo_operacion]}</span>
          ${r.monto_aprobado?`<span class="tag b">L${fmt(r.monto_aprobado)} · ${r.tasa}%</span>`:''}
          ${r.motivo_denegacion?`<span class="tag" style="color:var(--error)">${esc(r.motivo_denegacion)}</span>`:''}
        </div></div>`;
    }).join(''):'<div class="vacio"><p>Sin resultados.</p></div>';
    $$('#h-list .card[data-id]').forEach(c=>c.addEventListener('click',()=>abrir(c.dataset.id)));
  };
  $('#h-q').addEventListener('input',render);
  $('#h-e').addEventListener('change',render);
  $('#h-csv').addEventListener('click',()=>{

        nombreDe(d),cedulaDe(d),TIPO_L[s.tipo_operacion],s.estado,r.monto_aprobado||'',r.tasa||'',r.motivo_denegacion||'']);
    });
    const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));

}

function renderRubros(){
  $('#rub-list').innerHTML=P.rubros.map((r,i)=>`
    <div class="u-row" style="padding:9px 11px">
      <div class="u-i"><div class="u-n" style="font-size:13.5px">${esc(r.nombre)}</div></div>
      <select data-rp="${i}" style="width:auto;padding:6px 9px;font-size:12.5px">
        <option value="normal" ${!r.ideal&&!r.riesgo?'selected':''}>Normal</option>
        <option value="ideal" ${r.ideal?'selected':''}>Ideal</option>
        <option value="riesgo" ${r.riesgo?'selected':''}>Riesgo</option>
      </select>
      <button class="del" data-rd="${i}" style="height:32px;width:32px;font-size:16px">×</button>
    </div>`).join('');
  $$('[data-rp]').forEach(s=>s.addEventListener('change',e=>{
    const r=P.rubros[+e.target.dataset.rp];
    r.ideal=e.target.value==='ideal';r.riesgo=e.target.value==='riesgo';
  }));
  $$('[data-rd]').forEach(b=>b.addEventListener('click',()=>{P.rubros.splice(+b.dataset.rd,1);renderRubros();}));
}
async function guardarParams(){
  const g=id=>parseFloat($('#'+id).value)||0;
  const v={...P,minIngreso:g('p-min'),ingresoPref:g('p-pref'),limiteMin:g('p-lmin'),limiteMax:g('p-lmax'),
    redondeo:g('p-red')||1000,pctNuevo:g('p-pn'),mesMedio:g('p-mm'),pctMedio:g('p-pm'),mesAlto:g('p-ma'),
    pctAlto:g('p-pa'),tasaStd:g('p-ts'),tasaPref:g('p-tp'),tasaSuper:g('p-tsu'),spAntig:g('p-sa'),
    spCuotas:g('p-sc'),spMaxLeves:g('p-sl'),spDiasGrave:g('p-sg'),diasTarde:g('p-dt'),rubros:P.rubros};
  const b=$('#p-save');b.disabled=true;b.innerHTML='<span class="sp"></span>Guardando';
  const {error}=await sb.from('parametros_sistema').update({valores:v,actualizado_por:YO.id}).eq('id',1);
  b.disabled=false;b.textContent='Guardar parámetros';
  if(error){toast(traducir(error.message),'m');return;}
  P=v;toast('Parámetros guardados','k');
}

async function pintarUsuarios(){
  if(!esAdmin()){$('#cont').innerHTML='<div class="vacio"><p>Solo el administrador.</p></div>';return;}
  $('#cont').innerHTML='<div class="vacio"><p>Cargando…</p></div>';
  const {data,error}=await sb.rpc('listar_usuarios');
  if(error){$('#cont').innerHTML=`<div class="vacio"><p>${esc(error.message)}</p></div>`;return;}
  $('#cont').innerHTML=`
    <button class="btn btn-b btn-full" id="u-new" style="margin-bottom:14px">+ Crear usuario</button>
    <div id="u-list">${(data||[]).map(u=>`
      <div class="u-row ${u.activo?'':'u-off'}">
        <div class="u-av">${esc((u.nombre||'?').charAt(0).toUpperCase())}</div>
        <div class="u-i">
          <div class="u-n">${esc(u.nombre)}${u.id===YO.id?' <span class="tag b" style="font-size:10px">vos</span>':''}</div>
          <div class="u-m">${esc(u.email)} · ${esc([u.rol,...(u.roles_extra||[])].join(', '))}</div>
        </div>
        <button class="btn btn-g btn-sm" data-pw="${u.id}">Clave</button>
        <button class="btn btn-g btn-sm" data-act="${u.id}" data-a="${u.activo}">${u.activo?'Desactivar':'Activar'}</button>
      </div>`).join('')}</div>`;
  $('#u-new').addEventListener('click',modalUsuario);
  $$('[data-pw]').forEach(b=>b.addEventListener('click',async()=>{
    const p=prompt('Nueva contraseña (mínimo 8 caracteres):');
    if(!p) return;
    const {data:r}=await sb.rpc('cambiar_password',{p_user_id:b.dataset.pw,p_password:p});
    if(!r?.ok){toast(r?.error||'Error','m');return;}
    toast('Contraseña actualizada','k');
  }));
  $$('[data-act]').forEach(b=>b.addEventListener('click',async()=>{
    const on=b.dataset.a!=='true';
    const {data:r}=await sb.rpc('set_usuario_activo',{p_user_id:b.dataset.act,p_activo:on});
    if(!r?.ok){toast(r?.error||'Error','m');return;}
    toast(on?'Usuario activado':'Usuario desactivado','k');pintarUsuarios();
  }));
}

function detalle(){
  const s=ACT,d=s.datos_cliente||{};
  const esAse=['pendiente_revision','en_revision_asesor'].includes(s.estado)&&(rol('asesor')||esAdmin());
  const esAna=s.estado==='en_analisis'&&(rol('analista')||esAdmin());
  let h='';

  h+=`<div class="sec"><div class="sec-h"><h4>Operación</h4>
      <span class="badge ${s.tipo_operacion==='nuevo'?'p':'a'}">${TIPO_L[s.tipo_operacion]}</span></div>`;
  if(esAse&&s.origen==='asesor'){
    h+=`<div class="tipo-g" id="d-tipo">${Object.entries(TIPO_L).map(([k,v])=>
        `<button type="button" class="${s.tipo_operacion===k?'on':''}" data-t="${k}">${v}</button>`).join('')}</div>

      $('#d-fi-wrap')?.classList.toggle('hide',b.dataset.t==='nuevo');
      preview();
    }));
    $('#d-fi')?.addEventListener('change',e=>{ACT.fecha_ingreso_cliente=e.target.value||null;preview();});
    $('#add-cmp')?.addEventListener('click',()=>{
      $('#cmp').insertAdjacentHTML('beforeend',cmpHTML({},$$('#cmp .row-d').length));
      conectarCmp();recalcIngreso();

    conectarCmp();
    ['#i-prom','#i-ded'].forEach(x=>$(x)?.addEventListener('input',preview));
    preview();

    $('#p-proc')?.addEventListener('click',procesarPegado);
    $('#p-add')?.addEventListener('click',()=>{CUOTAS.push({num:CUOTAS.length+1,pactada:'',pagada:''});pintarCuotas();});
    $('#p-clr')?.addEventListener('click',()=>{CUOTAS=[];pintarCuotas();resultado();});
    pintarCuotas();
    $('#cr-s')?.addEventListener('input',e=>{
      const v=parseInt(e.target.value);
      $('#cr-c').value=v?(catEquifax(v)||''):'';resultado();
    });
    $$('.res').forEach(b=>b.addEventListener('click',()=>{
      const i=+b.dataset.ri,v=b.dataset.r;
      const its=ACT.checklist_analista.referencias.items;
      if(v==='falsa'&&its[i].resultado!=='falsa'){
        if(!confirm(`¿Marcar a ${its[i].nombre} como referencia FALSA?\n\nEsto DENIEGA la solicitud de inmediato y no se puede deshacer.`)) return;
      }
      its[i].resultado=its[i].resultado===v?null:v;
      $$(`.res[data-ri="${i}"]`).forEach(x=>x.classList.toggle('on',x.dataset.r===its[i].resultado));
      resultado();pie();
    }));
    $$('.r-c').forEach(t=>t.addEventListener('input',e=>{
      ACT.checklist_analista.referencias.items[+e.target.dataset.ci].comentario=e.target.value;
    }));
    resultado();
  }

/* ===== PEGADO DEL HISTORIAL (portado de analisis-credito.html) ===== */
function procesarPegado(){
  const raw=$('#paste').value.trim();
  if(!raw){toast('Pegá los datos primero','m');return;}
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return;
  const sep=lines[0].includes('\t')?'\t':',';
  const pd=s=>{
    if(!s) return '';
    s=String(s).trim().replace(/["']/g,'');
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
    if(m){let[,d,mo,y]=m;if(y.length===2)y='20'+y;return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;}
    return '';
  };
  const pn=s=>s?String(s).replace(/[L,\s"']/g,''):'';
  const isD=s=>/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(String(s||'').trim())||/^\d{4}-\d{2}-\d{2}$/.test(String(s||'').trim());
  const kw={doc:['documento','doc','referencia','ref'],fecha:['fecha','date','pago'],
            valor:['valor','monto','importe','capital'],accion:['accion','acción','tipo','concepto']};
  let map=null,start=0;
  for(let i=0;i<Math.min(lines.length,3);i++){
    const cols=lines[i].split(sep).map(c=>c.trim().toLowerCase().replace(/["']/g,''));
    if(cols.some(isD)) continue;
    const m={};let n=0;
    cols.forEach((c,ci)=>{for(const[k,ks] of Object.entries(kw)){
      if(m[k]!==undefined) continue;
      if(ks.some(x=>c.includes(x))){m[k]=ci;n++;}}});
    if(n>=2){map=m;start=i+1;break;}
  }
  if(!map){
    const first=lines[0].split(sep).map(c=>c.trim().replace(/["']/g,''));
    map={};
    let dc=-1;first.forEach((v,i)=>{if(dc<0&&isD(v))dc=i;});
    let doc=-1;first.forEach((v,i)=>{if(doc<0&&/^[A-Za-z]{1,4}[-\s]?\d+$/.test(v))doc=i;});
    let vc=-1,best=-1;
    first.forEach((v,i)=>{
      if(i===dc||i===doc||isD(v)) return;
      const nv=parseFloat(pn(v));
      if(nv&&(v.includes('.')||nv>=100)&&nv>best){best=nv;vc=i;}
    });
    if(dc>=0)map.fecha=dc; if(doc>=0)map.doc=doc; if(vc>=0)map.valor=vc;
    if(map.fecha===undefined||map.valor===undefined) map={doc:1,fecha:2,valor:3,accion:4};
    start=0;
  }
  const rows=[];
  for(let i=start;i<lines.length;i++){
    const cols=lines[i].split(sep).map(c=>c.trim().replace(/^["']|["']$/g,''));
    if(cols.length<2) continue;
    const get=k=>map[k]!==undefined?(cols[map[k]]||''):'';
    let fecha=pd(get('fecha'));
    if(!fecha) for(const c of cols){const x=pd(c);if(x){fecha=x;break;}}
    let valor=parseFloat(pn(get('valor')))||0;
    if(!valor) for(const c of cols){if(isD(c))continue;const nv=parseFloat(pn(c));if(nv&&nv>valor)valor=nv;}
    if(!fecha&&!valor) continue;
    rows.push({doc:get('doc')||'',fecha,valor:valor||0});
  }
  if(!rows.length){toast('No se reconoció ningún pago','m');return;}
  rows.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
  // El N-ésimo pago corresponde a la N-ésima cuota, sin importar fechas.
  CUOTAS=rows.map((r,i)=>({num:i+1,doc:r.doc,valor:r.valor,pagada:r.fecha,pactada:CUOTAS[i]?.pactada||''}));
  $('#paste').value='';
  pintarCuotas();resultado();
  toast(`${rows.length} pago(s) cargados`,'k');
}

function pintarCuotas(){
  const box=$('#cuotas-box');if(!box)return;
  if(!CUOTAS.length){box.innerHTML='<p style="font-size:13px;color:var(--gris)">Sin pagos cargados.</p>';kpis();return;}
  box.innerHTML=`<div class="tw"><table>
    <thead><tr><th>#</th><th>Documento</th><th>Fecha pactada</th><th>Fecha pagada</th><th>Valor</th><th>Días</th><th></th></tr></thead>
    <tbody>${CUOTAS.map((c,i)=>`<tr>
      <td>${c.num}</td>
      <td style="font-size:12px;color:var(--gris)">${esc(c.doc||'—')}</td>
      <td><input type="date" class="q-p" data-i="${i}" value="${c.pactada||''}"></td>
      <td><input type="date" class="q-r" data-i="${i}" value="${c.pagada||''}"></td>
      <td>${c.valor?fmtL(c.valor):'—'}</td>
      <td id="dd-${i}">—</td>
      <td><button class="del" data-dq="${i}" style="height:30px;width:30px;font-size:15px">×</button></td>
    </tr>`).join('')}</tbody></table></div>`;
  $$('.q-p').forEach(x=>x.addEventListener('change',e=>{CUOTAS[+e.target.dataset.i].pactada=e.target.value;kpis();resultado();}));
  $$('.q-r').forEach(x=>x.addEventListener('change',e=>{CUOTAS[+e.target.dataset.i].pagada=e.target.value;kpis();resultado();}));
  $$('[data-dq]').forEach(b=>b.addEventListener('click',()=>{
    CUOTAS.splice(+b.dataset.dq,1);CUOTAS.forEach((c,i)=>c.num=i+1);pintarCuotas();resultado();
  }));
  kpis();
}
function kpis(){
  const box=$('#kpis-box');if(!box)return;
  const h=analizarCuotas(CUOTAS);
  CUOTAS.forEach((c,i)=>{
    const el=$('#dd-'+i);if(!el)return;
    if(c._dias===null||c._dias===undefined){el.innerHTML='—';return;}
    const d=c._dias;
    el.innerHTML=`<span class="dd ${d>P.diasTarde?(d>=P.spDiasGrave?'m':'a'):'k'}">${d>0?'+'+d:d}</span>`;
  });
  box.innerHTML=h.total?`<div class="kpis">
    <div class="kpi k"><div class="kpi-v">${h.ok}</div><div class="kpi-l">Buenos</div></div>
    <div class="kpi ${h.late?'a':''}"><div class="kpi-v">${h.late}</div><div class="kpi-l">Tardíos</div></div>
    <div class="kpi ${h.maxDias>=P.spDiasGrave?'m':''}"><div class="kpi-v">${h.maxDias}</div><div class="kpi-l">Peor atraso</div></div>
    <div class="kpi"><div class="kpi-v">${h.total}</div><div class="kpi-l">Cuotas</div></div></div>`:'';
}
function resultado(){
  const el=$('#res');if(!el)return;
  const its=ACT.checklist_analista?.referencias?.items||[];
  const falsa=its.find(r=>r.resultado==='falsa');
  if(falsa){el.innerHTML=resHTML({motivo_denegacion:`Referencia falsa: ${falsa.nombre}`,denegado_automaticamente:true});return;}
  const ing=ACT.analisis_ingresos?.ingreso_promedio;
  const lim=calcLimite(ing,ACT.tipo_operacion,mesesCliente(ACT));
  if(!lim.ok){el.innerHTML=resHTML({motivo_denegacion:lim.motivo});return;}
  const h=ACT.tipo_operacion==='nuevo'?null:analizarCuotas(CUOTAS);
  const t=calcTasa(ACT.tipo_operacion,ing,perfilRubro(ACT.datos_cliente?.rubro),mesesCliente(ACT),h);
  const sc=parseInt($('#cr-s')?.value);
  el.innerHTML=resHTML({monto_aprobado:lim.monto,tasa:t.tasa,categoria_tasa:t.tipoTasa,
    razon:`${lim.regla} · ${t.regla}${sc?` · Equifax ${sc} (${catEquifax(sc)})`:''}`});
}

/* ===== ACCIONES ===== */
function pie(){
  const s=ACT;let h='';
  if(s.estado==='pendiente_revision'&&(rol('asesor')||esAdmin()))
    h=`<button class="btn btn-b" id="a1">Tomar solicitud</button>`;
  else if(s.estado==='en_revision_asesor'&&(rol('asesor')||esAdmin()))
    h=`<button class="btn btn-g" id="a2">Guardar</button><button class="btn btn-y" id="a3">Enviar a análisis</button>`;
  else if(s.estado==='en_analisis'&&(rol('analista')||esAdmin())){
    const falsa=(s.checklist_analista?.referencias?.items||[]).some(r=>r.resultado==='falsa');
    h=falsa?`<button class="btn btn-r" id="a6">Denegar por referencia falsa</button>`
           :`<button class="btn btn-g" id="a4">Guardar</button><button class="btn btn-y" id="a5">Enviar a verificar</button>`;
  }
  else if(s.estado==='verificado'&&(rol('analista')||esAdmin()))
    h=`<button class="btn btn-r" id="a8">Denegar</button><button class="btn btn-b" id="a7">Aprobar</button>`;
  $('#m-pie').innerHTML=h;
  $('#a1')?.addEventListener('click',()=>guardar({estado:'en_revision_asesor',asesor_id:YO.id}));
  $('#a2')?.addEventListener('click',()=>guardar(datosAsesor()));
  $('#a3')?.addEventListener('click',()=>guardar({...datosAsesor(),estado:'en_analisis'}));
  $('#a4')?.addEventListener('click',()=>guardar(datosAnalista()));
  $('#a5')?.addEventListener('click',()=>guardar({...datosAnalista(),estado:'por_verificar'}));
  $('#a6')?.addEventListener('click',()=>guardar(datosAnalista()));
  $('#a7')?.addEventListener('click',aprobar);
  $('#a8')?.addEventListener('click',denegar);
}
function datosAsesor(){
  const cs=$$('#cmp .row-d').map(r=>({
    desc:r.querySelector('.c-d').value.trim(),
    monto:parseFloat(r.querySelector('.c-m').value)||0})).filter(c=>c.monto>0);
  const out={
    analisis_ingresos:{comprobantes:cs,
      ingreso_promedio:parseFloat($('#i-prom')?.value)||0,
      deducciones:parseFloat($('#i-ded')?.value)||0,
      notas:$('#i-notas')?.value.trim()||''},
    asesor_id:ACT.asesor_id||YO.id,
    tipo_operacion:ACT.tipo_operacion};
  if(ACT.origen==='asesor') out.fecha_ingreso_cliente=ACT.fecha_ingreso_cliente||null;
  return out;
}
function datosAnalista(){
  const ck=JSON.parse(JSON.stringify(ACT.checklist_analista));
  const its=ck.referencias?.items||[];
  if(its.length&&its.every(r=>r.resultado)) ck.referencias.estado='realizado';
  const out={checklist_analista:ck,analista_id:YO.id};

  if(ACT.tipo_operacion==='nuevo'){
    out.comportamiento_pago={sin_historial:true,motivo:'Nuevo ingreso: sin historial previo'};
    out.checklist_analista.comportamiento_pago.estado='realizado';
  } else {
    const h=analizarCuotas(CUOTAS);
    out.comportamiento_pago={cuotas:CUOTAS,
      pagos:CUOTAS.filter(c=>c.pactada&&c.pagada),
      pagos_puntuales:h.ok,atrasos_leves:h.late,peor_atraso:h.maxDias,
      resultado:h.maxDias>=P.spDiasGrave?'con atrasos graves':(h.late?'con atrasos leves':'favorable')};
  }
  const sc=parseInt($('#cr-s')?.value)||null;
  if(sc) out.central_riesgo={score:sc,categoria:catEquifax(sc),
    observaciones:$('#cr-o')?.value.trim()||'',consultado_en:new Date().toISOString()};

  const ing=ACT.analisis_ingresos?.ingreso_promedio;
  const lim=calcLimite(ing,ACT.tipo_operacion,mesesCliente(ACT));
  if(lim.ok){
    const h=ACT.tipo_operacion==='nuevo'?null:analizarCuotas(CUOTAS);
    const t=calcTasa(ACT.tipo_operacion,ing,perfilRubro(ACT.datos_cliente?.rubro),mesesCliente(ACT),h);
    out.resultado_analisis={...ACT.resultado_analisis,monto_aprobado:lim.monto,tasa:t.tasa,
      categoria_tasa:t.tipoTasa,razon:`${lim.regla} · ${t.regla}`,calculado_en:new Date().toISOString()};
  }
  return out;
}
async function guardar(campos){
  const bs=$$('#m-pie .btn');bs.forEach(b=>b.disabled=true);
  const {error}=await sb.from('solicitudes').update(campos).eq('id',ACT.id);
  if(error){toast(traducir(error.message),'m');bs.forEach(b=>b.disabled=false);return;}
  toast('Guardado','k');
  await cargar();
  const a=SOLS.find(s=>s.id===ACT.id);
  if(a&&a.estado!==ACT.estado) cerrarModal();
  else if(a){ACT=a;CUOTAS=a.comportamiento_pago?.cuotas||CUOTAS;detalle();}
}
function traducir(m){
  if(m.includes('comportamiento de pago')) return 'Falta completar el comportamiento de pago.';
  if(m.includes('referencias')) return 'Faltan referencias por llamar.';
  if(m.includes('ingresos')) return 'Falta capturar los ingresos del cliente.';
  if(m.includes('fecha de ingreso')) return 'Un reingreso necesita la fecha de ingreso del cliente.';
  if(m.includes('analista')) return 'Debe asignarse un analista.';
  if(m.includes('verificador')) return 'Debe asignarse un verificador.';
  if(m.includes('row-level security')) return 'No tenés permiso para esta acción.';
  return m;
}
async function aprobar(){
  const r=ACT.resultado_analisis||{};
  if(!r.monto_aprobado){toast('Falta calcular el monto','m');return;}
  if(!confirm(`¿Aprobar L${fmt(r.monto_aprobado)} al ${r.tasa}%?`)) return;
  await guardar({estado:'aprobado'});
}
async function denegar(){
  const m=prompt('¿Por qué se deniega?');
  if(!m) return;
  await guardar({estado:'denegado',resultado_analisis:{...ACT.resultado_analisis,motivo_denegacion:m}});
}

(async function(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await arrancar(session);
})();
</script>
