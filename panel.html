<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1877F2">
<link rel="manifest" href="manifest-panel.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Panel MP">
<title>Panel de Crédito · Más Pisto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --azul:#1877F2; --azul-oscuro:#0B5AD6; --azul-tinta:#0A2A66;
    --amarillo:#FFD400; --amarillo-oscuro:#E6BE00;
    --cielo:#EAF3FF; --gris:#5B6B82; --linea:#DCE6F5;
    --error:#D63B3B; --error-lt:#FFF0F0;
    --ok:#1F9D57; --ok-lt:#EFFAF3;
    --amber:#B7791F; --amber-lt:#FFF8E6;
    --fondo:#F7FAFF;
    --sombra:0 10px 40px rgba(11,90,214,.12);
    --sombra-sm:0 2px 8px rgba(11,90,214,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--azul-tinta);background:var(--fondo);
    line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:3px solid rgba(24,119,242,.35);outline-offset:1px}
  h1,h2,h3,h4{font-family:'Poppins';letter-spacing:-.3px}
  a{color:var(--azul)}

  /* LOGIN */
  #login{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;
    background:radial-gradient(1100px 600px at 100% -10%,rgba(24,119,242,.10),transparent 60%),
               radial-gradient(900px 500px at -10% 110%,rgba(255,212,0,.10),transparent 55%),var(--fondo)}
  .login-box{width:100%;max-width:380px}
  .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:20px}
  .brand svg{width:44px;height:44px;flex:none}
  .brand .name{font-family:'Poppins';font-weight:800;font-size:26px;color:var(--azul);letter-spacing:-.5px;line-height:1}
  .brand .tag{font-family:'Poppins';font-weight:600;font-size:9.5px;letter-spacing:1.5px;color:var(--gris);margin-top:2px}
  .login-card{background:#fff;border:1px solid var(--linea);border-radius:22px;box-shadow:var(--sombra);overflow:hidden}
  .login-hero{background:linear-gradient(135deg,var(--azul),var(--azul-oscuro));color:#fff;padding:24px 26px;position:relative;overflow:hidden}
  .login-hero::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;
    background:radial-gradient(circle,rgba(255,212,0,.35),transparent 70%);border-radius:50%}
  .login-hero .eyebrow{font-family:'Poppins';font-weight:700;font-size:11px;letter-spacing:2px;color:var(--amarillo);text-transform:uppercase}
  .login-hero h1{font-size:24px;font-weight:800;margin-top:5px}
  .login-body{padding:24px 26px 26px}

  /* LAYOUT */
  #app{display:none;height:100dvh;min-height:0}
  .shell{display:flex;height:100dvh;min-height:0}
  .side{width:232px;flex:none;background:#fff;border-right:1px solid var(--linea);
    display:flex;flex-direction:column;min-height:0;transition:margin-left .22s ease}
  .side.hide{margin-left:-232px}
  .side-top{padding:18px 16px;border-bottom:1px solid var(--linea)}
  .side-brand{display:flex;align-items:center;gap:10px}
  .side-brand svg{width:32px;height:32px;flex:none}
  .side-brand .name{font-family:'Poppins';font-weight:800;font-size:19px;color:var(--azul);line-height:1}
  .side-brand .tag{font-family:'Poppins';font-weight:600;font-size:7.5px;letter-spacing:1.2px;color:var(--gris);margin-top:1px}
  .nav{flex:1;padding:12px 10px;overflow-y:auto}
  .nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;background:none;
    border-radius:11px;cursor:pointer;text-align:left;font-family:'Poppins';font-weight:600;
    font-size:14px;color:var(--gris);margin-bottom:3px}
  .nav-i:hover{background:var(--cielo);color:var(--azul)}
  .nav-i.on{background:var(--azul);color:#fff}
  .nav-i svg{width:18px;height:18px;flex:none}
  .nav-i .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(0,0,0,.08);padding:1px 7px;border-radius:9px}
  .nav-i.on .cnt{background:rgba(255,255,255,.25)}
  .nav-sep{font-family:'Poppins';font-weight:700;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--gris);padding:14px 12px 6px;opacity:.7}
  .side-pie{padding:12px;border-top:1px solid var(--linea)}
  .yo{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:var(--cielo)}
  .yo-av{width:32px;height:32px;border-radius:50%;background:var(--azul);color:#fff;flex:none;
    display:grid;place-items:center;font-family:'Poppins';font-weight:700;font-size:13px}
  .yo-n{font-family:'Poppins';font-weight:600;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .yo-r{font-size:10.5px;color:var(--gris);text-transform:capitalize}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--linea);flex:none}
  .burger{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--linea);background:#fff;
    cursor:pointer;display:grid;place-items:center;flex:none;color:var(--gris)}
  .burger:hover{border-color:var(--azul);color:var(--azul)}
  .top h2{font-size:18px;font-weight:700;flex:1}
  .cont{flex:1;overflow-y:auto;min-height:0;padding:18px;-webkit-overflow-scrolling:touch}
  .cont-in{max-width:960px;margin:0 auto}
  .scrim{position:fixed;inset:0;background:rgba(10,42,102,.4);z-index:80;display:none}
  @media(max-width:820px){
    .side{position:fixed;z-index:90;height:100dvh;box-shadow:var(--sombra)}
    .scrim.on{display:block}
  }

  .chips-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .chips-row::-webkit-scrollbar{display:none}
  .chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--linea);background:#fff;cursor:pointer;
    font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--gris)}
  .chip:hover{border-color:var(--azul)}
  .chip.on{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
  .chip .n{margin-left:6px;font-size:11px;opacity:.85}

  /* Kanban */
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;align-items:start}
  /* 5 columnas: ancho fijo cómodo y scroll horizontal si no caben, para que las
     tarjetas nunca queden apretadas sin importar el ancho de la pantalla. */
  .kanban-5{display:flex;overflow-x:auto;gap:13px;padding-bottom:10px;scrollbar-width:thin;align-items:start}
  .kanban-5 .kcol{flex:0 0 320px}
  @media(max-width:900px){
    .kanban-5 .kcol{flex:0 0 82vw;max-width:340px;scroll-snap-align:start}
    .kanban-5{scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 10px}
  }
  @media(max-width:1100px){
    .kanban{display:flex;overflow-x:auto;gap:11px;scroll-snap-type:x mandatory;
      margin:0 -18px;padding:0 18px 8px;scrollbar-width:none}
    .kanban::-webkit-scrollbar{display:none}
    .kcol{flex:0 0 78vw;scroll-snap-align:start;max-width:300px}
  }
  .kcol{background:var(--fondo);border:1px solid var(--linea);border-radius:16px;padding:10px;min-height:110px}
  .kcol-h{display:flex;align-items:center;gap:8px;padding:5px 8px 11px}
  .kcol-t{font-family:'Poppins';font-weight:700;font-size:13.5px}
  .kcol-n{margin-left:auto;font-family:'Poppins';font-weight:700;font-size:12px;color:#fff;
    min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 7px}
  .kdot{width:9px;height:9px;border-radius:50%;flex:none}
  .kcol.pend .kdot,.kcol.pend .kcol-n{background:var(--amber)}
  .kcol.ase  .kdot,.kcol.ase  .kcol-n{background:var(--azul)}
  .kcol.ana  .kdot,.kcol.ana  .kcol-n{background:#7C5CE0}
  .kcol.perfil .kdot,.kcol.perfil .kcol-n{background:#C4569B}
  .kcol.ver  .kdot,.kcol.ver  .kcol-n{background:#0E9BA8}
  .kcol.fin  .kdot,.kcol.fin  .kcol-n{background:var(--ok)}
  .kempty{text-align:center;padding:22px 10px;color:var(--gris);font-size:12.5px}
  /* Las finalizadas van abajo, en rejilla */
  .fin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}

  /* Tarjeta kanban */
  .kcard{background:#fff;border:1px solid var(--linea);border-radius:13px;box-shadow:var(--sombra-sm);
    padding:13px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,transform .1s}
  .kcard:hover{border-color:var(--azul)}
  .kcard:active{transform:scale(.99)}
  /* Color suave de fondo según el desenlace de la solicitud */
  .kcard.est-denegado{background:#FDF3F3;border-color:#F1C9C9}
  .kcard.est-denegado:hover{border-color:#E39A9A}
  .kcard.est-cancelado{background:#F5F6F8;border-color:#DDE1E7}
  .kcard.est-cancelado:hover{border-color:#C3CAD3}
  .kcard.est-aprobado,.kcard.est-desembolsado{background:#F1FAF4;border-color:#C4E7D2}
  .kcard.est-aprobado:hover,.kcard.est-desembolsado:hover{border-color:#98D3AE}
  /* Referencias que no respondieron: morado suave */
  .kcard.est-noresp{background:#F6F2FD;border-color:#DDCEF5}
  .kcard.est-noresp:hover{border-color:#C3A9EC}
  /* En espera por cliente: ámbar muy tenue con borde punteado */
  .kcard.est-espera{background:#FFFBF2;border-color:#EBD9AE;border-style:dashed}
  .kcard.est-espera:hover{border-color:#DBBE73}
  .kc-espera{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;
    background:#FBF0D6;color:#8A6D00;border:1px solid #EBD9AE}
  .kc-coinc{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;
    background:#FDECEC;color:#B02525;border:1px solid #F3C4C4}
  /* Cruce de datos (posibles duplicados) */
  .co-sec{border:1px solid #F3C4C4;background:#FFF6F6;border-radius:14px;padding:15px 16px;margin-bottom:15px}
  .co-h{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .co-h h4{font-family:'Poppins';font-size:14.5px;font-weight:700;color:#A82121;flex:1}
  .co-sub{font-size:12px;color:var(--gris);margin-bottom:12px}
  .co-item{background:#fff;border:1px solid var(--linea);border-radius:11px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
  .co-item:hover{border-color:var(--azul)}
  .co-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .co-nom{font-family:'Poppins';font-weight:600;font-size:13.5px;flex:1;min-width:0}
  .co-mot{font-size:12px;color:var(--error);margin-top:5px}
  .co-razon{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--gris);margin-top:4px}
  .co-razon b{color:var(--azul-tinta);font-weight:600}
  .co-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;flex:none}
  .co-alto{background:#FDECEC;color:#B02525}
  .co-medio{background:#FFF6E5;color:#8A6D00}
  .co-bajo{background:#F0F4FA;color:var(--gris)}
  .kc-nom{font-family:'Poppins';font-weight:600;font-size:14.5px;line-height:1.25}
  .kc-folio{font-size:11px;color:var(--azul);font-weight:600;margin-top:1px}
  .kc-fecha{font-size:11.5px;color:var(--gris);margin-top:8px;display:flex;align-items:center;gap:5px}
  .kc-row{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
  .kc-estado{font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--cielo);color:var(--azul);border:1px solid #C7DFFB}
  .kc-tipo{font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px}
  .kc-tipo.nuevo{background:var(--fondo);color:var(--gris);border:1px solid var(--linea)}
  .kc-tipo.reingreso{background:#FFF8DC;color:#8A6D00;border:1px solid #F2E08A}
  .kc-tipo.refinanciamiento{background:#F0E9FF;color:#6D4AB5;border:1px solid #D9C9F5}
  .kc-resp{font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;
    background:var(--fondo);color:var(--gris);border:1px solid var(--linea)}
  .kc-resp.libre{background:var(--amber-lt);color:var(--amber);border-color:#F2E08A}
  .kc-transc{margin-left:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
  .kc-transc.ok{background:var(--ok-lt);color:var(--ok)}
  .kc-transc.md{background:var(--amber-lt);color:var(--amber)}
  .kc-transc.no{background:var(--error-lt);color:var(--error)}

  .card{background:#fff;border:1px solid var(--linea);border-radius:16px;box-shadow:var(--sombra-sm);
    padding:16px;margin-bottom:11px;cursor:pointer;transition:border-color .15s,transform .1s}
  .card:hover{border-color:var(--azul)}
  .card:active{transform:scale(.995)}
  .c-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .c-nom{font-family:'Poppins';font-weight:600;font-size:15.5px;line-height:1.25}
  .c-folio{font-size:11.5px;color:var(--azul);font-weight:600;margin-top:2px;letter-spacing:.3px}
  .c-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .tag{font-size:11.5px;padding:3px 9px;border-radius:7px;background:var(--fondo);color:var(--gris);border:1px solid var(--linea)}
  .tag.b{background:var(--cielo);color:var(--azul);border-color:#C7DFFB;font-weight:600}
  .tag.y{background:#FFF8DC;color:#8A6D00;border-color:#F2E08A;font-weight:600}
  .sla{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;flex:none}
  .sla.ok{background:var(--ok-lt);color:var(--ok)}
  .sla.md{background:var(--amber-lt);color:var(--amber)}
  .sla.no{background:var(--error-lt);color:var(--error)}
  .vacio{text-align:center;padding:60px 20px;color:var(--gris)}
  .vacio svg{opacity:.3;margin-bottom:12px}
  .vacio p{font-size:14.5px}

  /* Detalle a pantalla completa (ya no es modal flotante) */
  .modal{position:fixed;inset:0;z-index:100;display:none;background:var(--fondo)}
  .modal.on{display:block}
  .modal-bg{display:none}
  .modal-b{position:absolute;inset:0;background:var(--fondo);display:flex;flex-direction:column;min-height:0}
  .modal-h{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;
    border-bottom:1px solid var(--linea);flex:none;box-shadow:var(--sombra-sm);z-index:2}
  .modal-h h3{font-size:18px;font-weight:700;line-height:1.15}
  .modal-h .f{font-size:12px;color:var(--azul);font-weight:600}
  .modal-s{flex:1;overflow-y:auto;min-height:0;padding:18px;padding-bottom:96px}
  /* Dos columnas en pantallas anchas: datos a la izquierda, trabajo del rol a la derecha */
  .det{max-width:1200px;margin:0 auto;display:grid;gap:14px;align-items:start}
  @media(min-width:1000px){ .det{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)} }
  .det-col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .modal-p{position:absolute;left:0;right:0;bottom:0;padding:12px 20px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--linea);
    display:flex;gap:9px;justify-content:flex-end;box-shadow:0 -4px 20px rgba(11,90,214,.07)}
  .modal-p .btn{max-width:260px}
  .x{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--linea);background:#fff;cursor:pointer;
    display:grid;place-items:center;flex:none;font-size:15px;color:var(--gris)}
  .x:hover{border-color:var(--error);color:var(--error)}

  .sec{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:18px;margin-bottom:12px}

  /* Comprobantes de ingresos: filas de pago + panel de resultados */
  .ing-cli{font-family:'Poppins';font-weight:600;font-size:15px;color:var(--azul-tinta);
    margin:-4px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--linea)}
  .pf-prev{margin:11px 0 0;padding-left:26px;font-size:12.5px;color:var(--tinta);line-height:1.7}
  .pf-prev li{border-bottom:1px solid var(--linea);padding:3px 0;white-space:pre-line}
  .ing-wrap{display:grid;gap:0;border:1px solid var(--linea);border-radius:14px;overflow:hidden;background:#fff}
  /* El panel de resultados solo va al lado si de verdad hay espacio */
  @media(min-width:1180px){ .ing-wrap{grid-template-columns:minmax(0,1fr) 220px} }
  .ing-left{padding:16px;min-width:0}
  .ing-right{background:var(--fondo);border-top:1px solid var(--linea);padding:16px;display:grid;
    grid-template-columns:1fr 1fr;gap:16px}
  @media(min-width:1180px){ .ing-right{border-top:0;border-left:1px solid var(--linea);
    grid-template-columns:1fr;align-content:center} }
  .ing-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--linea);background:#fff;grid-column:1/-1}
  .ing-h-t{font-family:'Poppins';font-weight:600;font-size:14px}
  .ing-h-s{font-size:11.5px;color:var(--azul)}
  .ing-lbl{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);margin-bottom:6px}
  .ing-sep{height:1px;background:var(--linea);margin:14px 0}
  /* Fecha y monto con ancho mínimo garantizado; el monto nunca se aplasta */
  .pago-row{display:grid;grid-template-columns:minmax(120px,140px) minmax(110px,1fr) 40px;
    gap:9px;align-items:center;margin-bottom:8px}
  .pago-row input{padding:9px 10px;font-size:14px;min-width:0;width:100%}
  .pago-row input[type=date]{font-size:13px;padding:9px 8px}
  .pago-x{height:38px;width:40px;border:1.5px solid var(--linea);background:#fff;color:var(--error);
    border-radius:9px;cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center}
  .pago-x:hover{background:var(--error-lt);border-color:var(--error)}
  /* Resumen de totales por mes */
  .ing-tot{margin-top:12px;border-top:1px solid var(--linea);padding-top:11px}
  .tot-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:13px;padding:5px 0}
  .tot-row .m{color:var(--gris)}
  .tot-row .v{font-family:'Poppins';font-weight:600}
  .tot-row.gran{border-top:1px dashed var(--linea);margin-top:5px;padding-top:9px}
  .tot-row.gran .v{font-size:15px;color:var(--azul-tinta);font-weight:800}
  .ing-kpi-l{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);
    display:flex;align-items:center;gap:6px}
  .ing-kpi-v{font-family:'Poppins';font-weight:800;font-size:30px;line-height:1.05;margin-top:4px}
  .ing-kpi-v.azul{color:var(--azul-tinta)}
  .ing-kpi-v.verde{color:var(--ok)}
  .ing-kpi-v.rojo{color:var(--error)}
  .ing-kpi-d{font-size:11.5px;color:var(--gris);margin-top:3px;line-height:1.35}
  .sec-h{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .sec-h h4{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--azul)}
  .badge{margin-left:auto;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:7px}
  .badge.p{background:var(--fondo);color:var(--gris);border:1px solid var(--linea)}
  .badge.k{background:var(--ok-lt);color:var(--ok)}

  .ref{background:var(--fondo);border:1px solid var(--linea);border-radius:12px;padding:13px;margin-bottom:9px}

  .aviso-t{font-family:'Poppins';font-weight:600;font-size:13.5px;line-height:1.25}

    text-overflow:ellipsis;white-space:nowrap}
  .aviso-cerrar{border:0;background:none;color:var(--gris);cursor:pointer;font-size:17px;
    line-height:1;padding:2px 4px;flex:none;border-radius:6px}

  @media(max-width:520px){
    #avisos{top:auto;bottom:14px;left:14px;right:14px;width:auto}
    .aviso{transform:translateY(115%)}
  }
  /* Botón de sonido en la barra superior */
  .snd-off{opacity:.45}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);
    background:var(--azul-tinta);color:#fff;padding:13px 22px;border-radius:26px;
    font-family:'Poppins';font-weight:600;font-size:13.5px;z-index:300;opacity:0;
    transition:transform .28s cubic-bezier(.2,.8,.3,1),opacity .28s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.k{background:var(--ok)} .toast.m{background:var(--error)}

  .sp{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;animation:g .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes g{to{transform:rotate(360deg)}}
  .hide{display:none!important}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  .file-ic{width:36px;height:36px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-family:'Poppins';font-weight:700;font-size:10px;letter-spacing:.5px}

    border-radius:13px;margin-bottom:9px;flex-wrap:wrap}
  .u-av{width:38px;height:38px;border-radius:50%;background:var(--cielo);color:var(--azul);flex:none;

  .panel-card{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:18px;box-shadow:var(--sombra-sm)}

  /* Barras apiladas semanales */
  .semana{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}

  .fun-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}

}

/* ===== MOTOR (portado de analisis-credito.html) ===== */
function calcLimite(prom,tipo,meses){
  if(!prom||prom<=0) return {ok:false,motivo:'Sin ingreso registrado'};
  if(prom<P.minIngreso) return {ok:false,motivo:`El ingreso promedio (${fmtL(prom)}) no alcanza el mínimo de ${fmtL(P.minIngreso)}.`};
  let pct,regla;
  if(tipo==='nuevo'){pct=P.pctNuevo/100;regla=`Nuevo ingreso: ${P.pctNuevo}% del ingreso mensual`;}
  else if(meses>=P.mesAlto){pct=P.pctAlto/100;regla=`Antigüedad ≥${P.mesAlto} meses: ${P.pctAlto}%`;}
  else if(meses>P.mesMedio){pct=P.pctMedio/100;regla=`Antigüedad >${P.mesMedio} meses: ${P.pctMedio}%`;}
  else{pct=P.pctNuevo/100;regla=`Antigüedad ≤${P.mesMedio} meses: ${P.pctNuevo}%`;}
  // Siempre hacia abajo: nunca se ofrece más crédito del que respalda el ingreso.
  // Se redondea antes a centavos para que el ruido de coma flotante no tumbe un escalón.
  const bruto=Math.round(prom*pct*100)/100;
  const red=Math.floor(bruto/(P.redondeo||1000))*(P.redondeo||1000);
  const fin=Math.min(P.limiteMax,Math.max(P.limiteMin,red));
  return {ok:true,monto:fin,pct,regla,clamped:Math.round(fin)!==Math.round(red)};
}
function calcTasa(tipo,prom,perfil,meses,h){
  let tasa=P.tasaStd,tipoTasa='Estándar',regla='';
  if(tipo==='nuevo'){
    if(prom>=P.ingresoPref&&perfil==='ideal'){tasa=P.tasaPref;tipoTasa='Preferencial';regla=`Nuevo + ≥${fmtL(P.ingresoPref)} + perfil ideal`;}
    else regla=perfil==='riesgo'?'Perfil de riesgo':'Nuevo sin condición preferencial';
    return {tasa,tipoTasa,regla};
  }
  if(prom>=P.ingresoPref&&perfil==='ideal'){tasa=P.tasaPref;tipoTasa='Preferencial';regla=`≥${fmtL(P.ingresoPref)} + perfil ideal`;}
  else regla=perfil==='riesgo'?'Perfil de riesgo':'Sin condición preferencial';
  const hh=h||{ok:0,late:0,maxDias:0};
  const grave=hh.maxDias>=P.spDiasGrave;
  const cumple=!grave&&hh.late<=P.spMaxLeves;
  if(perfil!=='riesgo'&&meses>=P.spAntig&&hh.ok>=P.spCuotas&&cumple){
    const prev=tasa;tasa=tasa===P.tasaStd?P.tasaPref:P.tasaSuper;tipoTasa='Súper Preferencial';
    regla+=` → ≥${P.spAntig}m + ≥${P.spCuotas} buenos + ≤${P.spMaxLeves} leves + 0 graves: ${prev}% → ${tasa}%`;
  }else if(perfil!=='riesgo'&&meses>=P.spAntig&&hh.ok>=P.spCuotas&&!cumple){
    regla+=grave?` · No aplica preferencial (tardío de ${hh.maxDias}d)`
                :` · No aplica preferencial (${hh.late} tardíos, máx ${P.spMaxLeves})`;
  }
  return {tasa,tipoTasa,regla};
}
function analizarCuotas(cs){
  let ok=0,late=0,maxDias=0,total=0;
  (cs||[]).forEach(c=>{
    c._dias=null;
    if(!c.pactada||!c.pagada) return;
    total++;
    const d=Math.round((new Date(c.pagada+'T12:00:00')-new Date(c.pactada+'T12:00:00'))/864e5);
    c._dias=d;
    if(d>P.diasTarde){late++;maxDias=Math.max(maxDias,d);} else ok++;
  });
  return {ok,late,maxDias,total};
}

  if(!ACT||!$('#modal').classList.contains('on')||nue.id!==ACT.id) return;
  const cambioEstado=nue.estado!==ACT.estado;
  ACT={...ACT,...nue};
  const i=SOLS.findIndex(s=>s.id===nue.id); if(i>=0) SOLS[i]=ACT;
  if(cambioEstado){
    CUOTAS=ACT.comportamiento_pago?.cuotas||CUOTAS;
    $('#m-t').textContent=nombreDe(ACT.datos_cliente||{});
    detalle();
    toast('Esta solicitud acaba de cambiar de estado','k');
  }
}

let AUDIO_CTX=null, SONIDO_ON=localStorage.getItem('mp_sonido')!=='0';

/* Genero los tonos con el navegador: no dependemos de archivos externos
   ni de que el hosting los sirva bien. */
function tono(notas){
  if(!SONIDO_ON) return;
  try{
    AUDIO_CTX = AUDIO_CTX || new (window.AudioContext||window.webkitAudioContext)();
    if(AUDIO_CTX.state==='suspended') AUDIO_CTX.resume();
    notas.forEach(([hz,inicio,dur,vol])=>{
      const o=AUDIO_CTX.createOscillator(), g=AUDIO_CTX.createGain();
      o.type='sine'; o.frequency.value=hz;
      o.connect(g); g.connect(AUDIO_CTX.destination);
      const t0=AUDIO_CTX.currentTime+inicio;
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(vol??.18,t0+.02);
      g.gain.exponentialRampToValueAtTime(.001,t0+dur);
      o.start(t0); o.stop(t0+dur+.02);
    });
  }catch(e){}
}
// Solicitud nueva: dos notas ascendentes, llama la atención
const sonidoNueva  = ()=>tono([[660,0,.16],[880,.14,.30]]);
// Cambio de estado: una nota corta y discreta
const sonidoCambio = ()=>tono([[520,0,.14,.12]]);
// Cierre negativo: nota descendente
const sonidoCierre = ()=>tono([[440,0,.16,.14],[330,.15,.28,.14]]);

/* Aviso visual que se apila en pantalla */
function aviso({titulo,texto,tipo='info',id}){
  const cont=$('#avisos');
  const el=document.createElement('div');
  el.className='aviso '+tipo;
  el.innerHTML=`
    <div class="aviso-ic">${tipo==='nueva'?'📥':tipo==='ok'?'✓':tipo==='no'?'✕':'↻'}</div>
    <div class="aviso-c">
      <div class="aviso-t">${esc(titulo)}</div>
      <div class="aviso-x">${esc(texto)}</div>
    </div>
    <button class="aviso-cerrar" aria-label="Cerrar">×</button>`;
  cont.prepend(el);
  requestAnimationFrame(()=>el.classList.add('on'));

  const quitar=()=>{ el.classList.remove('on');
    setTimeout(()=>el.remove(),300); };
  el.querySelector('.aviso-cerrar').addEventListener('click',e=>{e.stopPropagation();quitar();});
  if(id) el.addEventListener('click',()=>{ quitar(); abrir(id); });
  setTimeout(quitar,9000);

  // Máximo 4 avisos en pantalla
  while(cont.children.length>4) cont.lastElementChild.remove();
}

/* Título de la pestaña: muestra cuántas hay sin leer si no estás mirando */
let SIN_LEER=0;
const TITULO_BASE='Panel de Crédito · Más Pisto';
function marcarPestana(n){
  SIN_LEER = n===0 ? 0 : SIN_LEER+n;
  document.title = SIN_LEER>0 ? `(${SIN_LEER}) ${TITULO_BASE}` : TITULO_BASE;
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) marcarPestana(0); });
window.addEventListener('focus',()=>marcarPestana(0));

function notificarNueva(s){
  const d=s.datos_cliente||{};
  sonidoNueva();
  aviso({tipo:'nueva', id:s.id,
    titulo:'Nueva solicitud',
    texto:`${nombreDe(d)} · ${s.folio}`});
  if(document.hidden) marcarPestana(1);
  notificarSistema('Nueva solicitud de crédito', `${nombreDe(d)} · ${s.folio}`, s.id);
}

function notificarCambio(ant,nue){
  if(ant.estado===nue.estado) return;   // solo avisamos cambios de estado
  const d=nue.datos_cliente||{};
  const etq=ESTATUS_L[nue.estado]||nue.estado;

  // ¿Me toca a mí ahora? Entonces el aviso es más notorio.
  const meToca =
    (nue.estado==='pendiente_revision' && (rol('asesor')||esAdmin())) ||
    (nue.estado==='en_analisis'        && (rol('analista')||esAdmin())) ||
    (nue.estado==='llenar_perfil'      && (rol('asesor')||esAdmin())) ||
    (nue.estado==='verificado'         && (rol('analista')||rol('asesor')||esAdmin())) ||
    (['por_verificar','en_verificacion'].includes(nue.estado) && (rol('verificador')||esAdmin()));

  const cerrada=['aprobado','denegado','desembolsado','cancelado'].includes(nue.estado);
  if(cerrada) sonidoCierre(); else if(meToca) sonidoNueva(); else sonidoCambio();

  aviso({
    tipo: nue.estado==='aprobado'||nue.estado==='desembolsado' ? 'ok'
        : nue.estado==='denegado'||nue.estado==='cancelado' ? 'no' : 'info',
    id:nue.id,
    titulo: meToca ? `Te toca: ${etq}` : etq,
    texto:`${nombreDe(d)} · ${nue.folio}`});
  if(document.hidden) marcarPestana(1);
  // Notificación del sistema en CADA cambio de estado
  notificarSistema(meToca?`Te toca: ${etq}`:etq, `${nombreDe(d)} · ${nue.folio}`, nue.id);
}

/* Notificación del sistema operativo (la de la barra de tareas / pantalla del cel).
   En Android el navegador exige usarla a través del service worker; en escritorio
   funciona directa. Probamos SW primero y caemos a la directa si no hay. */
let SW_REG=null;
async function notificarSistema(titulo,texto,id){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const ops={body:texto, tag:'mp-'+(id||'panel'), renotify:true,
    icon:'icono-192.png', badge:'icono-192.png',
    data:{id:id||null}};
  try{
    const reg=SW_REG||await navigator.serviceWorker?.getRegistration();
    if(reg&&reg.showNotification){ reg.showNotification(titulo,ops); return; }
  }catch(e){}
  try{ new Notification(titulo,ops); }catch(e){}
}
function pedirPermisoNotif(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='default') Notification.requestPermission();
}

/* Registrar el service worker: habilita instalar la app en el celular
   y las notificaciones del sistema en Android. */
async function registrarSW(){
  if(!('serviceWorker' in navigator)) return;
  try{ SW_REG=await navigator.serviceWorker.register('sw.js'); }
  catch(e){ /* p.ej. abriendo el archivo local sin servidor */ }
}

$('#btn-sonido')?.addEventListener('click',()=>{

function sla(s){
  const hrs=(Date.now()-new Date(s.estado_desde))/36e5;
  const lim=(P.sla_horas||{})[s.estado]||24;
  const cls=hrs>lim?'no':hrs>lim*.66?'md':'ok';
  const m=Math.floor((Date.now()-new Date(s.estado_desde))/6e4);
  const t=m<60?m+'m':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'d';
  return `<span class="sla ${cls}">${t}</span>`;
}
const ETQ={pendiente_revision:'Nuevas',en_revision_asesor:'En revisión',en_analisis:'Análisis',
  llenar_perfil:'Llenar perfil',
  por_verificar:'Por verificar',en_verificacion:'Verificando',verificado:'Verificadas',
  en_espera_cliente:'En espera',
  aprobado:'Aprobadas',denegado:'Rechazadas',desembolsado:'Entregadas',cancelado:'Canceladas'};
const TIPO_L={nuevo:'Nuevo Préstamo',reingreso:'Reingreso',refinanciamiento:'Refinanciamiento'};
const DESEMB_L={efectivo:'Efectivo',transferencia:'Transferencia'};
const ESTATUS_L={pendiente_revision:'Sin tomar',en_revision_asesor:'En revisión',
  en_analisis:'En análisis',llenar_perfil:'Llenar perfil en el sistema',
  por_verificar:'Por verificar',en_verificacion:'En verificación',
  verificado:'Verificada',en_espera_cliente:'En espera por cliente',aprobado:'Aprobada',denegado:'Rechazada',
  desembolsado:'Entregada',cancelado:'Cancelada'};

/* Etapa efectiva para ubicar en el kanban: si está en espera, usa el estado previo. */
const etapaDe=s=>s.estado==='en_espera_cliente'?(s.estado_previo||'en_analisis'):s.estado;

/* Columnas por área responsable, no por etapa genérica */
const COL_PEND=['pendiente_revision'];
const COL_ASE =['en_revision_asesor','llenar_perfil'];  // el asesor transcribe el perfil
const COL_ANA =['en_analisis'];
const COL_VER =['por_verificar','en_verificacion','verificado'];  // verificado -> a desembolso
const COL_FIN =['aprobado','denegado','desembolsado','cancelado'];

function esDeHoy(s){
  const f=new Date(s.cerrado_en||s.actualizado_en);
  const h=new Date();
  return f.getFullYear()===h.getFullYear()&&f.getMonth()===h.getMonth()&&f.getDate()===h.getDate();
}
function fechaHora(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('es-HN',{day:'2-digit',month:'2-digit',year:'2-digit'})+
    ' · '+d.toLocaleTimeString('es-HN',{hour:'2-digit',minute:'2-digit'});
}
function transcurrido(s){
  // Tiempo desde que se creó la solicitud
  const min=Math.floor((Date.now()-new Date(s.creado_en))/6e4);
  const txt=min<60?min+' min':min<1440?Math.floor(min/60)+' h':Math.floor(min/1440)+' d';
  // Color según SLA del estado actual (mientras esté abierta)
  let cls='ok';
  if(!COL_FIN.includes(s.estado)){
    const hrs=(Date.now()-new Date(s.estado_desde))/36e5;
    const lim=(P.sla_horas||{})[s.estado]||24;
    cls=hrs>lim?'no':hrs>lim*.66?'md':'ok';
  }
  return {txt,cls};
}

/* ===== SOLICITUDES (KANBAN) ===== */
function pintarSolicitudes(){
  const porFecha=(a,b)=>new Date(a.estado_desde)-new Date(b.estado_desde);
  const pend=SOLS.filter(s=>COL_PEND.includes(etapaDe(s)))
    .sort((a,b)=>new Date(a.creado_en)-new Date(b.creado_en));
  const ase=SOLS.filter(s=>etapaDe(s)==='en_revision_asesor').sort(porFecha);
  const ana=SOLS.filter(s=>COL_ANA.includes(etapaDe(s))).sort(porFecha);
  const perfil=SOLS.filter(s=>etapaDe(s)==='llenar_perfil').sort(porFecha);
  const ver=SOLS.filter(s=>COL_VER.includes(etapaDe(s))).sort(porFecha);
  const fin=SOLS.filter(s=>COL_FIN.includes(s.estado)&&esDeHoy(s))
    .sort((a,b)=>new Date(b.cerrado_en||b.actualizado_en)-new Date(a.cerrado_en||a.actualizado_en));

  const col=(clase,titulo,lista,vacio)=>`
    <div class="kcol ${clase}">
      <div class="kcol-h"><span class="kdot"></span><span class="kcol-t">${titulo}</span>
        <span class="kcol-n">${lista.length}</span></div>
      ${lista.length?lista.map(kcardHTML).join(''):`<div class="kempty">${vacio}</div>`}
    </div>`;

  $('#cont').innerHTML=`<div class="kanban kanban-5">
    ${col('pend','Pendiente',pend,'Nada pendiente')}
    ${col('ase','Asesor(a)',ase,'Nada con el asesor')}
    ${col('ana','Analista',ana,'Nada con el analista')}
    ${col('perfil','Llenar perfil',perfil,'Nada por transcribir')}
    ${col('ver','Verificador',ver,'Nada en verificación')}
  </div>
  ${fin.length?`<div style="max-width:100%;margin-top:16px">
    <div class="kcol fin" style="background:transparent;border:0;padding:0">
      <div class="kcol-h" style="padding-left:2px"><span class="kdot"></span>
        <span class="kcol-t">Finalizadas hoy</span><span class="kcol-n">${fin.length}</span></div>
      <div class="fin-grid">${fin.map(kcardHTML).join('')}</div>
    </div></div>`:''}`;
  $$('.kcard[data-id]').forEach(c=>c.addEventListener('click',()=>abrir(c.dataset.id)));
}

/* Clase de color de la tarjeta según desenlace / señales.
   Prioridad: cerradas (rojo/gris/verde) > en espera > referencias sin responder (morado). */
function claseTarjeta(s){
  if(s.estado==='denegado') return 'est-denegado';
  if(s.estado==='cancelado') return 'est-cancelado';
  if(s.estado==='aprobado'||s.estado==='desembolsado') return 'est-'+s.estado;
  if(s.estado==='en_espera_cliente') return 'est-espera';
  const refs=s.checklist_analista?.referencias?.items||[];
  if(refs.some(r=>r.resultado==='no_respondio')) return 'est-noresp';
  return '';
}
function kcardHTML(s){
  const d=s.datos_cliente||{};
  const t=transcurrido(s);
  const tipo=s.tipo_operacion||'nuevo';
  const et=etapaDe(s);
  // Responsable según la etapa efectiva (contando la espera)
  let resp=null;
  if(COL_ASE.includes(et)) resp=quien(s.asesor_id);
  else if(COL_ANA.includes(et)) resp=quien(s.analista_id);
  else if(COL_VER.includes(et)) resp=quien(s.verificador_id);
  const enEspera=s.estado==='en_espera_cliente';
  return `<div class="kcard ${claseTarjeta(s)}" data-id="${s.id}">
    <div class="kc-nom">${esc(nombreDe(d))}</div>
    <div class="kc-folio">${esc(s.folio)}</div>
    <div class="kc-fecha">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ${fechaHora(s.creado_en)}
    </div>
    <div class="kc-row">
      <span class="kc-tipo ${tipo}">${TIPO_L[tipo]}</span>
      <span class="kc-transc ${t.cls}">${t.txt}</span>
    </div>
    <div class="kc-row">
      <span class="kc-estado">${enEspera?'En espera':(ESTATUS_L[s.estado]||s.estado)}</span>
      ${enEspera?'<span class="kc-espera">⏸ cliente</span>':''}
      ${COINC[s.id]?`<span class="kc-coinc" title="Coincide en teléfono o cédula con ${COINC[s.id].n} solicitud(es)">⚠ ${COINC[s.id].n} coincidencia${COINC[s.id].n>1?'s':''}</span>`:''}
      ${resp?`<span class="kc-resp">${esc(resp)}</span>`
             :(COL_VER.includes(et)?'<span class="kc-resp libre">sin asignar</span>':'')}
      ${s.origen==='cliente'?'<span class="kc-tipo nuevo">del formulario</span>':''}
    </div>
  </div>`;
}

/* ===== HISTORIAL ===== */
function pintarHistorial(){
  const cerr=SOLS.filter(s=>['aprobado','denegado','desembolsado','cancelado'].includes(s.estado))
    .sort((a,b)=>new Date(b.cerrado_en||b.actualizado_en)-new Date(a.cerrado_en||a.actualizado_en));
  $('#cont').innerHTML=`
  <div id="prom-box"></div>
  <div class="sec"><div class="sec-h"><h4>Buscar</h4></div>
    <div class="g2">
      <div class="fld"><label>Nombre, cédula o folio</label><input id="h-q" placeholder="Escribí para filtrar"></div>
      <div class="fld"><label>Estado</label><select id="h-e">
        <option value="">Todos</option><option value="aprobado">Aprobadas</option>
        <option value="denegado">Rechazadas</option><option value="cancelado">Canceladas</option><option value="desembolsado">Entregadas</option></select></div>
    </div>
    <button class="btn btn-g btn-sm" id="h-csv">Descargar CSV</button></div>
  <div id="h-list"></div>`;
  const abiertos=new Set();   // fechas expandidas (la más reciente arranca abierta)
  const render=()=>{
    const q=($('#h-q').value||'').toLowerCase().trim(), e=$('#h-e').value;
    const f=cerr.filter(s=>{
      if(e&&s.estado!==e) return false;
      if(!q) return true;
      const d=s.datos_cliente||{};
      return [nombreDe(d),cedulaDe(d),s.folio].join(' ').toLowerCase().includes(q);
    });
    if(!f.length){ $('#h-list').innerHTML='<div class="vacio"><p>Sin resultados.</p></div>'; return; }

    // Agrupar por fecha de cierre (día)
    const grupos={};
    f.forEach(s=>{
      const k=(s.cerrado_en||s.actualizado_en||'').slice(0,10)||'Sin fecha';
      (grupos[k]=grupos[k]||[]).push(s);
    });
    const fechas=Object.keys(grupos).sort().reverse();
    if(!abiertos.size&&fechas.length) abiertos.add(fechas[0]);   // la más reciente abierta
    // Si hay búsqueda activa, se expande todo para ver los resultados
    const expandirTodo=!!q||!!e;

    const fechaLarga=k=>{
      if(k==='Sin fecha') return k;
      const [y,m,d]=k.split('-').map(Number);
      const dt=new Date(y,m-1,d);
      const hoy=new Date(); hoy.setHours(0,0,0,0);
      const ayer=new Date(hoy); ayer.setDate(hoy.getDate()-1);
      if(dt.getTime()===hoy.getTime()) return 'Hoy';
      if(dt.getTime()===ayer.getTime()) return 'Ayer';
      return dt.toLocaleDateString('es-HN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    };

    $('#h-list').innerHTML=fechas.map(k=>{
      const lista=grupos[k];
      const on=expandirTodo||abiertos.has(k);
      const nOk=lista.filter(s=>['aprobado','desembolsado'].includes(s.estado)).length;
      const nNo=lista.filter(s=>s.estado==='denegado').length;
      const nCa=lista.filter(s=>s.estado==='cancelado').length;
      return `<div class="h-grupo ${on?'on':''}" data-f="${k}">
        <button class="h-gh" data-toggle="${k}">
          <span class="h-flecha">${on?'▾':'▸'}</span>
          <span class="h-fecha">${fechaLarga(k)}</span>
          <span class="h-resumen">
            ${nOk?`<span class="tag b">${nOk} aprobada${nOk>1?'s':''}</span>`:''}
            ${nNo?`<span class="tag" style="color:var(--error)">${nNo} rechazada${nNo>1?'s':''}</span>`:''}
            ${nCa?`<span class="tag">${nCa} cancelada${nCa>1?'s':''}</span>`:''}
            <span class="h-n">${lista.length}</span>
          </span>
        </button>
        <div class="h-gc" ${on?'':'hidden'}>
        ${lista.map(s=>{
          const d=s.datos_cliente||{},r=s.resultado_analisis||{};
          const cl={aprobado:'k',denegado:'m',desembolsado:'k',cancelado:'p'}[s.estado];
          return `<div class="card" data-id="${s.id}">
            <div class="c-top"><div style="min-width:0">
              <div class="c-nom">${esc(nombreDe(d))}</div>
              <div class="c-folio">${esc(s.folio)} · ${new Date(s.cerrado_en||s.actualizado_en).toLocaleTimeString('es-HN',{hour:'2-digit',minute:'2-digit'})}</div>
            </div><span class="badge ${cl}" style="margin:0">${ETQ[s.estado]}</span></div>
            <div class="c-meta"><span class="tag">${TIPO_L[s.tipo_operacion]}</span>
              ${r.monto_aprobado?`<span class="tag b">L${fmt(r.monto_aprobado)} · ${r.tasa}%</span>`:''}
              ${r.motivo_denegacion?`<span class="tag" style="color:var(--error)">${esc(r.motivo_denegacion)}</span>`:''}
            </div></div>`;
        }).join('')}
        </div>
      </div>`;
    }).join('');

    $$('#h-list [data-toggle]').forEach(b=>b.addEventListener('click',()=>{
      const k=b.dataset.toggle;
      abiertos.has(k)?abiertos.delete(k):abiertos.add(k);
      render();
    }));
    $$('#h-list .card[data-id]').forEach(c=>c.addEventListener('click',()=>abrir(c.dataset.id)));
  };
  $('#h-q').addEventListener('input',render);
  $('#h-e').addEventListener('change',render);
  $('#h-csv').addEventListener('click',async()=>{
    const b=$('#h-csv'); b.disabled=true; b.innerHTML='<span class="sp d"></span>Generando';
    const rows=[['Folio','Fecha','Nombre','Cedula','Tipo','Estado','Monto','Tasa','Motivo',
      'Min asesor','Min analista revision','Min analista referencias','Min verificador','Min desembolso','Min total']];
    for(const s of cerr){
      const d=s.datos_cliente||{},r=s.resultado_analisis||{};
      const {data:t}=await sb.rpc('tiempos_solicitud',{p_id:s.id});
      const j=t||{};
      rows.push([s.folio,new Date(s.cerrado_en||s.actualizado_en).toLocaleDateString('es-HN'),
        nombreDe(d),cedulaDe(d),TIPO_L[s.tipo_operacion],s.estado,r.monto_aprobado||'',r.tasa||'',r.motivo_denegacion||'',
        j.asesor?.minutos??'', j.analista_revision?.minutos??'', j.analista_referencias?.minutos??'',
        j.verificador?.minutos??'', j.desembolso?.minutos??'', j.total?.minutos??'']);
    }
    b.disabled=false; b.textContent='Descargar CSV';
    const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
    a.download=`historial_${new Date().toISOString().slice(0,10)}.csv`;a.click();
  });
  render();
  pintarPromedios();
}

/* Promedios por área: dónde se atora el proceso */
async function pintarPromedios(){
  const box=$('#prom-box'); if(!box) return;
  const {data,error}=await sb.rpc('promedios_areas',{p_desde:null,p_hasta:null});
  if(error||!data||!data.n){ box.innerHTML=''; return; }

  if(!filas.length){ box.innerHTML=''; return; }
  const suma=filas.reduce((t,f)=>t+f.minutos,0)||1;
  const peor=filas.reduce((a,b)=>b.minutos>a.minutos?b:a,filas[0]);

  box.innerHTML=`<div class="sec"><div class="sec-h"><h4>Tiempo promedio por área</h4>
      <span class="badge p">${data.n} solicitud${data.n===1?'':'es'}</span></div>

        title="${f.n}: ${dur(f.minutos)}"></i>`).join('')}
    </div>
    ${filas.map(f=>`<div class="tm-row">
      <span class="tm-dot" style="background:${f.c}"></span>
      <div class="tm-n">${f.n}${f.k===peor.k?' <span class="tm-abierto" style="color:var(--error)">más lento</span>':''}</div>
      <span class="tm-v">${dur(f.minutos)}</span>
    </div>`).join('')}
    <div class="tm-total"><span>Promedio total del proceso</span>
      <span class="v">${dur(data.total)}</span></div>
  </div>`;
}

/* ===== MÉTRICAS / DASHBOARD ===== */
let DASH_FILTRO={modo:'mes', anio:null, mes:null, desde:null, hasta:null};

function mesFiscalActual(){
  // El mes fiscal va del 9 al 8. Antes del día 9, todavía estamos en el mes fiscal anterior.
  const h=new Date();
  let m=h.getMonth(), a=h.getFullYear(); // m: 0-11
  if(h.getDate()<9){ m-=1; if(m<0){m=11;a-=1;} }
  return {anio:a, mes:m+1}; // mes 1-12
}
function rangoMesFiscal(anio,mes){
  // mes 1-12. desde = 9 de ese mes; hasta = 8 del mes siguiente
  const desde=new Date(anio,mes-1,9);
  const hasta=new Date(anio,mes,8);
  return {desde:isoFecha(desde), hasta:isoFecha(hasta)};
}
function rangoAnioFiscal(anio){
  // Año fiscal: del 9 ene al 8 ene siguiente (aproximación anual sobre el mismo criterio)
  return {desde:`${anio}-01-09`, hasta:`${anio+1}-01-08`};
}
const isoFecha=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const MESES_L=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function rangoActivo(){
  const f=DASH_FILTRO;
  if(f.modo==='mes'){ const mf=mesFiscalActual(); return rangoMesFiscal(f.anio??mf.anio, f.mes??mf.mes); }
  if(f.modo==='anio'){ const mf=mesFiscalActual(); return rangoAnioFiscal(f.anio??mf.anio); }
  return {desde:f.desde||null, hasta:f.hasta||null};
}

async function pintarMetricas(){
  const cont=$('#cont');
  const mf=mesFiscalActual();
  if(DASH_FILTRO.anio===null){ DASH_FILTRO.anio=mf.anio; DASH_FILTRO.mes=mf.mes; }

        <button data-m="rango" class="${DASH_FILTRO.modo==='rango'?'on':''}">Rango</button>
      </div>

      <button class="btn btn-g btn-sm" id="dash-causas" style="flex:none;width:auto">Editar causas</button>
      <span style="font-size:12px;color:var(--gris);margin-left:auto">${desde||'inicio'} → ${hasta||'hoy'}</span>
    </div>
    <div id="dash-body"><div class="dash-empty"><span class="sp"></span> Cargando métricas…</div></div>`;

  pintarDashCtrl();

    DASH_FILTRO.modo=b.dataset.m; pintarMetricas();

  // Datos del servidor (agregados) + tiempos por área
  let M, T;
  try{
    const [m1,t1]=await Promise.all([

      sb.rpc('promedios_areas',{p_desde:desde,p_hasta:hasta})

  const enRango=SOLS.filter(s=>{

    return (!desde||f>=desde)&&(!hasta||f<=hasta);
  });

  $('#dash-body').innerHTML=dashBodyHTML(M,T,enRango,desde,hasta);

function pintarDashCtrl(){

/* Serie semanal lunes→domingo de la semana actual (aprobadas vs rechazadas) */
function serieSemana(sols){
  const h=new Date(); const dow=(h.getDay()+6)%7; // 0=lunes
  const lunes=new Date(h); lunes.setDate(h.getDate()-dow); lunes.setHours(0,0,0,0);
  const dias=[]; const L=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  for(let i=0;i<7;i++){ const d=new Date(lunes); d.setDate(lunes.getDate()+i); dias.push({fecha:isoFecha(d),lbl:L[i],ok:0,no:0}); }
  sols.forEach(s=>{
    // se cuenta por la fecha de cierre (cuándo se decidió), no de creación
    const ref=(s.cerrado_en||s.actualizado_en||s.creado_en||'').slice(0,10);
    const dd=dias.find(x=>x.fecha===ref); if(!dd) return;
    if(['aprobado','desembolsado'].includes(s.estado)) dd.ok++;
    else if(s.estado==='denegado') dd.no++;
  });
  return dias;
}

function dashBodyHTML(M,T,sols,desde,hasta){
  if(!M.total){ return `<div class="dash-empty">No hay solicitudes en este periodo.<br>Probá con otro mes o un rango más amplio.</div>`; }
  const L=n=>'L '+fmt(Math.round(n||0));
  // Días del rango para el promedio por día
  let ndias=1;
  if(desde&&hasta){ ndias=Math.max(1,Math.round((new Date(hasta)-new Date(desde))/86400000)+1); }
  const promDia=(M.total/ndias);

  // KPIs
  const kpis=[
    {t:'Solicitudes',big:M.total,sub:`${M.abiertas} en proceso`,ic:'azul',svg:ICO.solicitudes},
    {t:'Aprobadas',big:M.aprobadas,sub:`${M.pct_aceptacion}% de aceptación`,ic:'ok',svg:svgCheck},
    {t:'Rechazadas',big:M.denegadas,sub:`${M.canceladas} canceladas`,ic:'err',svg:svgX},
    {t:'Monto colocado',big:L(M.monto_colocado),sub:M.desembolsadas?`ticket ${L(M.ticket_promedio)}`:'sin desembolsos',ic:'amber',svg:svgMoney},
    {t:'Ingreso promedio',big:L(M.ingreso_promedio),sub:`${M.con_ingreso} con análisis`,ic:'viol',svg:svgTrend},
    {t:'Límite promedio',big:L(M.limite_promedio),sub:'crédito autorizado',ic:'azul',svg:svgCard},
    {t:'Solicitudes/día',big:promDia.toFixed(1),sub:`en ${ndias} día(s)`,ic:'ok',svg:svgCal},
    {t:'Ciclo promedio',big:T.total?dur(T.total):'—',sub:'de inicio a cierre',ic:'amber',svg:svgClock},
  ];
  const kpisH=kpis.map(k=>`<div class="kpi-card">
    <div class="kpi-ico kpi-i-${k.ic}">${k.svg}</div>
    <div class="kpi-t">${k.t}</div>
    <div class="kpi-big">${k.big}</div>
    <div class="kpi-sub">${k.sub}</div></div>`).join('');

  // Semana
  const sem=serieSemana(sols);
  const maxSem=Math.max(1,...sem.map(d=>d.ok+d.no));
  const semH=sem.map(d=>{
    const tot=d.ok+d.no;
    const hOk=tot?(d.ok/maxSem*100):0, hNo=tot?(d.no/maxSem*100):0;
    return `<div class="sem-col">
      <div class="sem-tot">${tot||''}</div>
      <div class="sem-bar" title="${d.lbl}: ${d.ok} aprob, ${d.no} rech">
        ${d.no?`<div class="sem-seg-no" style="height:${hNo}%"></div>`:''}
        ${d.ok?`<div class="sem-seg-ok" style="height:${hOk}%"></div>`:''}
      </div>
      <div class="sem-lbl">${d.lbl}</div></div>`;
  }).join('');

  // Rubro (barras horizontales)
  const maxRub=Math.max(1,...M.por_rubro.map(r=>r.n));
  const rubH=M.por_rubro.length?M.por_rubro.map(r=>`<div class="hbar">
    <div class="hbar-top"><span class="l">${esc(r.rubro)}</span><span class="v">${r.n}</span></div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${r.n/maxRub*100}%;background:var(--azul)"></div></div>
  </div>`).join(''):'<div class="dash-empty">Sin datos</div>';

  // Tiempos por área (dónde nos tardamos)
  const areasT=[
    {k:'asesor',n:'Asesor'},{k:'analista_revision',n:'Analista · revisión'},
    {k:'analista_referencias',n:'Analista · referencias'},
    {k:'llenar_perfil',n:'Llenar perfil'},
    {k:'verificacion_cola',n:'Cola de verificación'},{k:'verificador',n:'Verificador'},
    {k:'espera_cliente',n:'Espera por cliente'},{k:'asesor_espera_docs',n:'Espera de documentos'},
    {k:'desembolso',n:'Desembolso'}
  ].map(a=>({...a,min:+T[a.k]||0})).filter(a=>a.min>0).sort((a,b)=>b.min-a.min);
  const maxT=Math.max(1,...areasT.map(a=>a.min));
  const cuelloBotella=areasT[0];
  const tiempoH=areasT.length?areasT.map(a=>`<div class="hbar">
    <div class="hbar-top"><span class="l">${a.n}</span><span class="v">${dur(a.min)}</span></div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${a.min/maxT*100}%;background:${a.k===cuelloBotella.k?'var(--error)':'var(--amber)'}"></div></div>
  </div>`).join(''):'<div class="dash-empty">Aún no hay solicitudes cerradas para medir tiempos.</div>';

  // Embudo de conversión
  const emb=[
    {n:'Recibidas',v:M.total,c:'var(--azul)'},
    {n:'En proceso o más',v:M.total-M.canceladas,c:'#3B82F6'},
    {n:'Aprobadas',v:M.aprobadas,c:'var(--ok)'},
    {n:'Desembolsadas',v:M.desembolsadas,c:'#0E9BA8'},
  ];
  const maxEmb=Math.max(1,...emb.map(e=>e.v));
  const embH=emb.map(e=>`<div class="fun-row">
    <div class="fun-lbl">${e.n}</div>
    <div class="fun-track"><div class="fun-fill" style="width:${Math.max(e.v/maxEmb*100,e.v?12:0)}%;background:${e.c}">${e.v}</div></div>
  </div>`).join('');

  return `
    <div class="kpis-grid">${kpisH}</div>

    <div class="dash-row dash-2">
      <div class="panel-card">
        <h3>Aprobadas vs rechazadas · semana actual</h3>
        <div class="pc-sub">Lunes a domingo · verde aprobadas, rojo rechazadas</div>
        <div class="semana">${semH}</div>
      </div>
      <div class="panel-card">
        <h3>Causas de rechazo</h3>
        <div class="pc-sub">Distribución de motivos de denegación</div>
        <div class="donut-wrap">
          <svg class="donut" id="donut-svg" viewBox="0 0 42 42"></svg>
          <div class="donut-leg" id="donut-leg"></div>
        </div>
      </div>
    </div>

    <div class="dash-row dash-2b">
      <div class="panel-card">
        <h3>¿Dónde nos tardamos más?</h3>
        <div class="pc-sub">Tiempo promedio por área en solicitudes cerradas · solo horas hábiles</div>
        ${tiempoH}
        ${cuelloBotella?`<div class="tiempo-hint">⏱ El mayor tiempo se va en <b>${cuelloBotella.n}</b> (${dur(cuelloBotella.min)} en promedio).</div>`:''}
      </div>
      <div class="panel-card">
        <h3>Solicitudes por rubro</h3>
        <div class="pc-sub">Top rubros en el periodo</div>
        ${rubH}
      </div>
    </div>

    <div class="dash-row dash-2b">
      <div class="panel-card">
        <h3>Embudo de conversión</h3>
        <div class="pc-sub">De solicitud recibida a crédito desembolsado</div>
        ${embH}
      </div>
      <div class="panel-card">
        <h3>Resumen del periodo</h3>
        <div class="pc-sub">Indicadores clave</div>
        <dl class="dl">
          <dt>Tasa de aceptación</dt><dd style="font-weight:700">${M.pct_aceptacion}%</dd>
          <dt>Monto colocado</dt><dd>${L(M.monto_colocado)}</dd>
          <dt>Ticket promedio</dt><dd>${M.desembolsadas?L(M.ticket_promedio):'—'}</dd>
          <dt>Ingreso promedio</dt><dd>${L(M.ingreso_promedio)}</dd>
          <dt>Límite promedio</dt><dd>${L(M.limite_promedio)}</dd>
          <dt>Solicitudes por día</dt><dd>${promDia.toFixed(1)}</dd>
          <dt>Ciclo promedio</dt><dd>${T.total?dur(T.total):'—'}</dd>
        </dl>
      </div>
    </div>`;
}

/* Donut de causas de rechazo en SVG (stroke-dasharray sobre un círculo) */
const DONUT_COLORES=['#D63B3B','#B7791F','#1877F2','#7C5CE0','#1F9D57','#0E9BA8','#94A3B8'];
function dibujarDonut(causas){
  const svg=$('#donut-svg'), leg=$('#donut-leg'); if(!svg||!leg) return;
  const tot=(causas||[]).reduce((a,c)=>a+c.n,0);
  if(!tot){ svg.innerHTML=''; leg.innerHTML='<div class="dash-empty" style="padding:10px">Sin rechazos en el periodo</div>'; return; }
  const R=15.915, C=2*Math.PI*R; let off=0; let circ='';
  causas.forEach((c,i)=>{
    const frac=c.n/tot, len=frac*C, col=DONUT_COLORES[i%DONUT_COLORES.length];
    circ+=`<circle cx="21" cy="21" r="${R}" fill="transparent" stroke="${col}" stroke-width="6"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"></circle>`;
    off+=len;
  });
  svg.innerHTML=`<circle cx="21" cy="21" r="${R}" fill="transparent" stroke="#F0F4FA" stroke-width="6"></circle>${circ}
    <text x="21" y="20" text-anchor="middle" font-size="7" font-weight="700" fill="#0A2A66">${tot}</text>
    <text x="21" y="26" text-anchor="middle" font-size="3.3" fill="#5B6B82">rechazos</text>`;
  leg.innerHTML=causas.map((c,i)=>`<div class="leg-i">
    <span class="leg-dot" style="background:${DONUT_COLORES[i%DONUT_COLORES.length]}"></span>
    ${esc(c.causa)}<span class="lv">${c.n} · ${Math.round(c.n/tot*100)}%</span></div>`).join('');
}

/* Editor del catálogo de causas (usado en Parámetros y en el modal del dashboard).
   Recibe el contenedor donde se dibuja. Todos los cambios se guardan al instante. */
const CATEGORIAS_SUGERIDAS=['Referencias','Ingreso insuficiente','Fuera de cobertura',
  'Documentos/datos','Sobreendeudamiento','Perfil no elegible','Desistió el cliente',
  'Sin respuesta','Duplicada','Otro'];
async function renderCausasEditor(box){
  if(!box) return;
  const grupo=(tipo,titulo)=>{
    const list=CAUSAS.filter(c=>c.tipo===tipo);
    return `<div style="margin-bottom:6px;font-weight:600;font-size:13px;color:var(--tinta)">${titulo}</div>
      ${list.map(c=>`
        <div class="u-row" style="padding:8px 10px;gap:8px;flex-wrap:wrap">
          <input data-ctxt="${c.id}" value="${esc(c.texto)}"
            style="flex:2;min-width:150px;padding:6px 9px;font-size:12.5px" title="Texto que ve el analista">
          <input list="cats-dl" data-ccat="${c.id}" value="${esc(c.categoria)}"
            style="flex:1;min-width:120px;padding:6px 9px;font-size:12.5px" title="Categoría en el dashboard">
          <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--gris);flex:none">
            <input type="checkbox" data-cact="${c.id}" ${c.activo?'checked':''} style="width:auto"> activa</label>
          <button class="del" data-cdel="${c.id}" data-txt="${esc(c.texto)}" style="height:30px;width:30px;font-size:15px;flex:none">×</button>
        </div>`).join('')}
      <div style="display:flex;gap:8px;margin:8px 0 16px">
        <input id="cnew-${tipo}" placeholder="Nueva causa de ${tipo==='denegado'?'rechazo':'cancelación'}"
          style="flex:2;font-size:13px">
        <input list="cats-dl" id="cnewcat-${tipo}" placeholder="Categoría" style="flex:1;font-size:13px">
        <button class="add" data-cadd="${tipo}" style="flex:none">+ Agregar</button>
      </div>`;
  };
  box.innerHTML=`
    <datalist id="cats-dl">${CATEGORIAS_SUGERIDAS.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    ${grupo('denegado','Rechazo')}
    ${grupo('cancelado','Cancelación')}`;

  const recargar=async()=>{ await cargarCausas(); renderCausasEditor(box); };

  // Editar texto o categoría (guarda al salir del campo)
  box.querySelectorAll('[data-ctxt]').forEach(i=>i.addEventListener('change',async e=>{
    const v=e.target.value.trim(); if(!v) return recargar();
    const {error}=await sb.from('causas_cierre').update({texto:v}).eq('id',+e.target.dataset.ctxt);
    if(error){toast(traducir(error.message),'m');return;} await cargarCausas(); toast('Causa actualizada','k');
  }));
  box.querySelectorAll('[data-ccat]').forEach(i=>i.addEventListener('change',async e=>{
    const v=e.target.value.trim()||'Otro';
    const {error}=await sb.from('causas_cierre').update({categoria:v}).eq('id',+e.target.dataset.ccat);
    if(error){toast(traducir(error.message),'m');return;} await cargarCausas(); toast('Categoría actualizada','k');
  }));
  box.querySelectorAll('[data-cact]').forEach(i=>i.addEventListener('change',async e=>{
    const {error}=await sb.from('causas_cierre').update({activo:e.target.checked}).eq('id',+e.target.dataset.cact);
    if(error){toast(traducir(error.message),'m');return;} await cargarCausas();
  }));
  box.querySelectorAll('[data-cdel]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm(`¿Quitar la causa "${b.dataset.txt}"?\nLas solicitudes ya cerradas con este motivo no cambian.`)) return;
    const {error}=await sb.from('causas_cierre').delete().eq('id',+b.dataset.cdel);
    if(error){toast(traducir(error.message),'m');return;} recargar(); toast('Causa eliminada','k');
  }));
  box.querySelectorAll('[data-cadd]').forEach(b=>b.addEventListener('click',async()=>{
    const tipo=b.dataset.cadd;
    const txt=$('#cnew-'+tipo).value.trim(), cat=($('#cnewcat-'+tipo).value.trim()||'Otro');
    if(!txt){toast('Escribí el texto de la causa','m');return;}
    if(CAUSAS.some(c=>c.tipo===tipo&&c.texto.toLowerCase()===txt.toLowerCase())){toast('Esa causa ya existe','m');return;}
    const orden=Math.max(0,...CAUSAS.filter(c=>c.tipo===tipo).map(c=>c.orden||0))+1;
    const {error}=await sb.from('causas_cierre').insert({texto:txt,categoria:cat,tipo,orden});
    if(error){toast(traducir(error.message),'m');return;} recargar(); toast('Causa agregada','k');
  }));
}

/* Editor de días feriados. Los tiempos de gestión no cuentan estos días. */
async function renderFeriadosEditor(box){
  if(!box) return;
  box.innerHTML='<p style="font-size:13px;color:var(--gris)">Cargando…</p>';
  const {data,error}=await sb.from('feriados').select('*').order('fecha');
  if(error){ box.innerHTML=`<p style="font-size:13px;color:var(--error)">${esc(traducir(error.message))}</p>`; return; }
  const hoy=new Date().toISOString().slice(0,10);
  const lista=data||[];
  const fmtF=f=>{ const [y,m,d]=f.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('es-HN',{weekday:'short',day:'numeric',month:'long',year:'numeric'}); };
  box.innerHTML=`
    ${lista.length?lista.map(f=>`
      <div class="u-row" style="padding:8px 10px;gap:8px;${f.fecha<hoy?'opacity:.55':''}">
        <div class="u-i"><div class="u-n" style="font-size:13.5px;text-transform:capitalize">${fmtF(f.fecha)}</div>
          <div class="u-m">${esc(f.descripcion||'')}</div></div>
        <button class="del" data-fdel="${f.fecha}" data-d="${esc(f.descripcion||f.fecha)}"
          style="height:30px;width:30px;font-size:15px;flex:none">×</button>
      </div>`).join(''):'<p style="font-size:13px;color:var(--gris)">Sin feriados cargados.</p>'}
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <input type="date" id="fer-fecha" style="flex:none;width:auto">
      <input id="fer-desc" placeholder="Descripción (ej. Día del Trabajo)" style="flex:1;min-width:150px">
      <button class="add" id="fer-add" style="flex:none">+ Agregar</button>
    </div>`;
  const recargar=()=>renderFeriadosEditor(box);
  box.querySelectorAll('[data-fdel]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm(`¿Quitar el feriado "${b.dataset.d}"?\nEse día volverá a contar como día hábil.`)) return;
    const {error}=await sb.from('feriados').delete().eq('fecha',b.dataset.fdel);
    if(error){toast(traducir(error.message),'m');return;} recargar(); toast('Feriado eliminado','k');
  }));
  $('#fer-add')?.addEventListener('click',async()=>{
    const f=$('#fer-fecha').value, d=$('#fer-desc').value.trim();
    if(!f){toast('Elegí la fecha','m');return;}
    const {error}=await sb.from('feriados').insert({fecha:f,descripcion:d});
    if(error){toast(traducir(error.message),'m');return;} recargar(); toast('Feriado agregado','k');
  });
}

      <div class="fld"><label>Referencia 1</label><input id="ns-r1n" placeholder="Nombre"></div>
      <div class="fld"><label>Teléfono</label><input id="ns-r1t" placeholder="0000-0000"></div>
    </div>
    <div class="g2">
      <div class="fld"><label>Referencia 2</label><input id="ns-r2n" placeholder="Nombre"></div>
      <div class="fld"><label>Teléfono</label><input id="ns-r2t" placeholder="0000-0000"></div>
    </div>

  $('#m-pie').innerHTML=`<button class="btn btn-g" id="ns-x">Cancelar</button>
    <button class="btn btn-b" id="ns-ok">Crear solicitud</button>`;
  $('#modal').classList.add('on');
  pushCapa(cerrarModal);

  let tipo='nuevo';
  $$('#ns-tipo button').forEach(b=>b.addEventListener('click',()=>{
    $$('#ns-tipo button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');tipo=b.dataset.t;
    $('#ns-fi-wrap').classList.toggle('hide',tipo==='nuevo');
    $('#ns-nota').innerHTML = tipo==='nuevo'
      ? `Un <b>nuevo ingreso</b> aplica al ${P.pctNuevo}% del ingreso mensual, sin importar antigüedad.`
      : `El límite sale de la <b>antigüedad como cliente</b>: ≤${P.mesMedio}m → ${P.pctNuevo}%, >${P.mesMedio}m → ${P.pctMedio}%, ≥${P.mesAlto}m → ${P.pctAlto}%.`;
  }));
  $('#ns-x').addEventListener('click',()=>cerrarPorBoton(cerrarModal));
  $('#ns-ok').addEventListener('click',async()=>{
    const err=m=>{$('#ns-err').textContent=m;$('#ns-err').classList.remove('hide');};
    $('#ns-err').classList.add('hide');
    const nom=$('#ns-nom').value.trim();
    if(!nom) return err('Escribí el nombre del cliente.');
    if(tipo!=='nuevo'&&!$('#ns-fi').value) return err(`Un ${tipo} necesita la fecha de ingreso del cliente.`);
    const refs=[
      {nombre:$('#ns-r1n').value.trim(),telefono:$('#ns-r1t').value.trim(),parentesco:''},
      {nombre:$('#ns-r2n').value.trim(),telefono:$('#ns-r2t').value.trim(),parentesco:''}
    ].filter(r=>r.nombre&&r.telefono);
    const b=$('#ns-ok');b.disabled=true;b.innerHTML='<span class="sp"></span>Creando';
    const {error}=await sb.from('solicitudes').insert({
      origen:'asesor',estado:'en_revision_asesor',asesor_id:YO.id,
      tipo_operacion:tipo,tipo_credito:'general',
      fecha_ingreso_cliente:tipo==='nuevo'?null:$('#ns-fi').value,
      datos_cliente:{nombre:nom,cedula:$('#ns-ced').value.trim(),telefono:$('#ns-tel').value.trim(),
        monto:parseFloat($('#ns-monto').value)||0,empresa:$('#ns-emp').value.trim(),
        rubro:$('#ns-rubro').value,direccion:$('#ns-dcasa').value.trim(),
        direccion_casa:$('#ns-dcasa').value.trim(),dir_empresa:$('#ns-dtrab').value.trim(),
        direccion_trabajo:$('#ns-dtrab').value.trim(),consentimiento:true,referencias:refs}
    });
    b.disabled=false;b.textContent='Crear solicitud';
    if(error) return err(traducir(error.message));
    toast('Solicitud creada','k');cerrarModalNav();cargar();
  });
});

/* ===== DETALLE ===== */
function abrir(id){
  ACT=SOLS.find(s=>s.id===id);if(!ACT)return;
  CUOTAS=(ACT.comportamiento_pago?.cuotas)||[];
  const d=ACT.datos_cliente||{};
  $('#m-t').textContent=nombreDe(d);
  $('#m-f').textContent=`${ACT.folio} · ${TIPO_L[ACT.tipo_operacion]}`;
  $('#modal').classList.add('on');
  pushCapa(cerrarModal);   // el botón "atrás" del cel cerrará el detalle
  detalle();
}
function cerrarModal(){$('#modal').classList.remove('on');ACT=null;}
/* Cierra el detalle de forma programática (tras una acción) consumiendo su
   entrada del historial, para que la pila del botón "atrás" quede sincronizada. */
function cerrarModalNav(){ cerrarPorBoton(cerrarModal); }
$('#m-cerrar').addEventListener('click',()=>cerrarPorBoton(cerrarModal));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on'))cerrarPorBoton(cerrarModal);});

/* El modal secundario (#asig) se abre encima del detalle: también registra capa. */
function abrirAsig(){
  $('#asig').classList.add('on');
  pushCapa(cerrarAsigInterno);
}
function cerrarAsigInterno(){ $('#asig').classList.remove('on'); if(_asigLuego){const f=_asigLuego;_asigLuego=null;f();} }
let _asigLuego=null;
/* Cierre desde un botón del modal (X, Volver, fondo, o tras completar la acción).
   'luego' es lógica opcional a correr al cerrar (p.ej. refrescar métricas). */
function cerrarAsig(luego){ _asigLuego=luego||null; cerrarPorBoton(cerrarAsigInterno); }

/* Bitácora: quién hizo cada cambio y cuándo */
async function pintarBitacora(){
  const box=$('#tiempos-box'); if(!box||!ACT) return;
  const {data,error}=await sb.rpc('historial_de',{p_id:ACT.id});
  if(error||!data?.length) return;

  const linea=h=>{
    const auto=h.detalle?.automatico?' <span class="bit-auto">automático</span>':'';
    if(h.accion==='estado'){
      const de=ESTATUS_L[h.estado_anterior]||h.estado_anterior||'—';
      const a=ESTATUS_L[h.estado_nuevo]||h.estado_nuevo;
      return `Pasó de <b>${esc(de)}</b> a <b>${esc(a)}</b>${auto}`
        +(h.detalle?.motivo?`<div class="bit-d">${esc(h.detalle.motivo)}</div>`:'');
    }
    const cs=h.detalle?.cambios||[];
    return (h.accion==='asignacion'?'Cambió la asignación':'Editó datos')
      +(cs.length?`<div class="bit-d">${cs.map(c=>
        `${esc(c.campo)}: ${c.antes?esc(c.antes):'vacío'} → <b>${c.despues?esc(c.despues):'vacío'}</b>`
       ).join('<br>')}</div>`:'');
  };

  box.insertAdjacentHTML('beforeend',`
    <div class="sec"><div class="sec-h"><h4>Bitácora</h4>
      <span class="badge p">${data.length} movimiento${data.length===1?'':'s'}</span></div>
      ${data.map(h=>`<div class="bit-row">
        <div class="bit-pt"></div>
        <div class="bit-c">
          <div class="bit-t">${linea(h)}</div>
          <div class="bit-m">${esc(h.quien)} · ${new Date(h.cuando).toLocaleString('es-HN',
            {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      </div>`).join('')}
    </div>`);
}

const AREAS=[
  {k:'asesor_espera_docs',  n:'Espera de documentos',   c:'#B0B7C3'},
  {k:'asesor',              n:'Asesor',                 c:'#1877F2'},
  {k:'analista_revision',   n:'Analista · revisión',    c:'#7C5CE0'},
  {k:'analista_referencias',n:'Analista · referencias', c:'#B7791F'},
  {k:'llenar_perfil',       n:'Llenar perfil',          c:'#C4569B'},
  {k:'verificacion_cola',   n:'Cola de verificación',   c:'#8FB9A8'},
  {k:'verificador',         n:'Verificador',            c:'#1F9D57'},
  {k:'espera_cliente',      n:'Espera por cliente',     c:'#D9A441'},
  {k:'desembolso',          n:'Desembolso',             c:'#0E9BA8'}
];
function dur(min){
  min=Math.max(0,Math.round(min||0));
  if(min<60) return min+' min';
  const h=Math.floor(min/60), m=min%60;
  if(h<24) return m?`${h} h ${m} min`:`${h} h`;
  const d=Math.floor(h/24), hr=h%24;
  return hr?`${d} d ${hr} h`:`${d} d`;
}
async function pintarTiempos(){
  const box=$('#tiempos-box'); if(!box||!ACT) return;
  const {data,error}=await sb.rpc('tiempos_solicitud',{p_id:ACT.id});
  if(error||!data){ box.innerHTML=''; return; }

  const filas=AREAS.filter(a=>data[a.k]).map(a=>({...a,...data[a.k]}));
  if(!filas.length){ box.innerHTML=''; return; }
  const suma=filas.reduce((t,f)=>t+(f.minutos||0),0)||1;

  box.innerHTML=`<div class="sec"><div class="sec-h"><h4>Tiempos por área</h4>
      <span class="badge ${data.total?.abierto?'a':'k'}">${data.total?.abierto?'en curso':'cerrada'}</span></div>
    <div style="font-size:11.5px;color:var(--gris);margin-bottom:10px">En horas hábiles (L-V 8:30–4:30 · Sáb 8:30–12:00)</div>
    <div class="tm-barra">
      ${filas.map(f=>`<i style="width:${(f.minutos/suma*100).toFixed(1)}%;background:${f.c}"
        title="${f.n}: ${dur(f.minutos)}"></i>`).join('')}
    </div>
    ${filas.map(f=>`<div class="tm-row">
      <span class="tm-dot" style="background:${f.c}"></span>
      <div class="tm-n"><div>${f.n}</div>
        ${f.inicio?`<div class="tm-sub">${new Date(f.inicio).toLocaleString('es-HN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${f.fin?' → '+new Date(f.fin).toLocaleString('es-HN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}</div>`:''}
      </div>
      ${f.abierto?'<span class="tm-abierto">en curso</span>':''}
      <span class="tm-v">${dur(f.minutos)}</span>
    </div>`).join('')}
    <div class="tm-total"><span>Total del proceso</span>
      <span class="v">${dur(data.total?.minutos)}</span></div>
  </div>`;
}


/* Los comprobantes están en un bucket privado: se abren con URL firmada
   de 5 minutos, no con enlace permanente. */
function conectarArchivos(){
  const arch=ACT.datos_cliente?.archivos||[];
  $$('[data-ver]').forEach(b=>b.addEventListener('click',async()=>{
    const a=arch[+b.dataset.ver]; if(!a) return;
    const t=b.textContent; b.disabled=true; b.textContent='…';
    const {data,error}=await sb.storage.from('comprobantes').createSignedUrl(a.path,300);
    b.disabled=false; b.textContent=t;
    if(error||!data?.signedUrl){ toast('No se pudo abrir el archivo','m'); return; }
    window.open(data.signedUrl,'_blank','noopener');
  }));
}

/* Pagos por frecuencia: cuántos hay en un mes */
const VECES_MES={Semanal:4.33,Catorcenal:2.17,Quincenal:2,Mensual:1};
function frecuenciaSugerida(diasPago){
  const t=String(diasPago||'').toLowerCase();
  if(t.includes('semanal')) return 'Semanal';
  if(t.includes('catorcen')) return 'Catorcenal';
  if(t.includes('quincen')) return 'Quincenal';
  if(t.includes('mensual')) return 'Mensual';
  return 'Quincenal';
}

    </div>`;
  abrirAsig();
  $('#in-x').addEventListener('click',()=>cerrarAsig());
  $('#in-ok').addEventListener('click',async()=>{
    const ref=$('#in-ref').value, res=$('#in-res').value, nota=$('#in-nota').value.trim();

    const {error}=await sb.rpc('registrar_intento_referencia',
      {p_id:ACT.id,p_referencia:ref,p_resultado:res,p_nota:nota});
    if(error){ b.disabled=false; b.textContent='Registrar';
      $('#in-err').textContent=traducir(error.message); $('#in-err').classList.remove('hide'); return; }
    cerrarAsig();
    toast('Intento registrado','k');

function conectar(esAse,esAna){

  // (p.ej. el asesor puede agregar referencia aunque la solicitud esté en análisis)
  $('#edit-nom')?.addEventListener('click',abrirEditarNombre);
  $('#add-ref')?.addEventListener('click',abrirAgregarReferencia);
  $('#nota-add')?.addEventListener('click',guardarNota);
  // En el paso de perfil, cargar la lista de verificadores disponibles
  if($('#pf-verif')) cargarVerifSelect();
  $('#pf-copiar')?.addEventListener('click',()=>copiarPerfil(ACT));
  $('#add-intento')?.addEventListener('click',abrirRegistrarIntento);
  if(esAse){
    $('#conf-docs')?.addEventListener('click',confirmarDocs);
  }
  if(esAse){

/* Promedio mensual. Si hay pagos fechados, se agrupan por mes y se promedian
   los meses COMPLETOS (los meses a medio llenar distorsionarían el promedio).
   Si no hay fechas, se estima con la frecuencia declarada. */
function recalcIngreso(){
  const filas=$$('#pagos .pago-row').map(r=>({
    fecha:r.querySelector('.p-f').value,
    monto:parseFloat(String(r.querySelector('.p-m').value).replace(/,/g,''))||0
  })).filter(p=>p.monto>0);

  const frec=$('#i-frec')?.value||'Quincenal';
  const veces=VECES_MES[frec]||2;

  const cnt=$('#ing-count');
  if(cnt) cnt.textContent=`${filas.length} pago${filas.length===1?'':'s'}`;

  // Agrupar por mes
  const meses={};
  filas.forEach(p=>{
    const k=p.fecha?p.fecha.slice(0,7):'sin-fecha';
    (meses[k]=meses[k]||[]).push(p.monto);
  });
  const claves=Object.keys(meses).filter(k=>k!=='sin-fecha').sort();
  const sinFecha=meses['sin-fecha']||[];

  let prom=0, detalle='';
  if(claves.length){
    // Un mes se considera completo si tiene los pagos que corresponden a la frecuencia
    const esperados=Math.round(veces);
    const totales=claves.map(k=>({
      mes:k, total:meses[k].reduce((a,b)=>a+b,0), n:meses[k].length,
      completo: meses[k].length>=esperados
    }));
    const completos=totales.filter(m=>m.completo);
    const base=completos.length?completos:totales;
    prom=Math.round(base.reduce((a,m)=>a+m.total,0)/base.length);
    detalle=completos.length
      ? `Promedio de ${completos.length} mes(es) completo(s)`
      : `Estimado con ${totales.length} mes(es) parcial(es)`;

    // Render del desglose
    const nombreMes=k=>{
      const [y,m]=k.split('-');
      return new Date(+y,+m-1,1).toLocaleDateString('es-HN',{month:'long',year:'numeric'});
    };
    $('#ing-tot').innerHTML=
      totales.map(m=>`<div class="tot-row">
        <span class="m">${nombreMes(m.mes)} · ${m.n} pago${m.n>1?'s':''}${m.completo?'':' <span style="color:var(--amber)">(incompleto)</span>'}</span>
        <span class="v">${fmtL(m.total)}</span></div>`).join('')
      + (sinFecha.length?`<div class="tot-row"><span class="m">Sin fecha · ${sinFecha.length} pago(s)</span>
          <span class="v">${fmtL(sinFecha.reduce((a,b)=>a+b,0))}</span></div>`:'')
      + `<div class="tot-row gran"><span class="m">Promedio mensual</span>
          <span class="v">${fmtL(prom)}</span></div>`;
  } else if(filas.length){
    // Sin fechas: estimar por frecuencia
    const promPago=filas.reduce((a,p)=>a+p.monto,0)/filas.length;
    prom=Math.round(promPago*veces);
    detalle=`${filas.length} pago(s) ${frec.toLowerCase()} × ${veces} al mes`;
    $('#ing-tot').innerHTML=`
      <div class="tot-row"><span class="m">Promedio por pago</span><span class="v">${fmtL(promPago)}</span></div>
      <div class="tot-row"><span class="m">Pagos al mes (${frec.toLowerCase()})</span><span class="v">× ${veces}</span></div>
      <div class="tot-row gran"><span class="m">Promedio mensual</span><span class="v">${fmtL(prom)}</span></div>`;
  } else {
    $('#ing-tot').innerHTML='<div class="tot-row"><span class="m">Agregá los pagos para calcular</span></div>';
  }

  // El promedio calculado es el que manda; ya no hay campo manual
  ACT._ingresoCalculado = prom;

  const kp=$('#kpi-prom'), kpd=$('#kpi-prom-d');
  if(kp){
    kp.textContent=prom?fmtL(prom):'L 0';
    kpd.textContent=detalle||'—';
  }
  const kl=$('#kpi-lim'), kld=$('#kpi-lim-d');
  if(kl){
    const r=calcLimite(prom,ACT.tipo_operacion,mesesCliente(ACT));
    if(r.ok){
      kl.textContent='L '+fmt(r.monto); kl.className='ing-kpi-v verde';
      kld.textContent=r.regla+(r.clamped?' · ajustado al rango':'');
    } else {
      kl.textContent='L 0'; kl.className='ing-kpi-v rojo';
      kld.textContent=prom?r.motivo:'—';
    }
  }
  // Aviso: si el ingreso queda bajo el mínimo, al guardar se rechaza sola
  const av=$('#ing-auto');
  if(av){
    const bajo = prom>0 && prom < (P.minIngreso||13000);
    av.classList.toggle('hide',!bajo);
    if(bajo) av.innerHTML=`<b>Ojo:</b> ${fmtL(prom)} está por debajo del mínimo de ${fmtL(P.minIngreso||13000)}. Si guardás con este ingreso, la solicitud <b>se rechazará automáticamente</b>.`;
  }
}
/* ===== PEGADO DEL HISTORIAL (portado de analisis-credito.html) ===== */
function procesarPegado(){
  const raw=$('#paste').value.trim();
  if(!raw){toast('Pegá los datos primero','m');return;}
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return;
  const sep=lines[0].includes('\t')?'\t':',';
  const pd=s=>{
    if(!s) return '';
    s=String(s).trim().replace(/["']/g,'');
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
    if(m){let[,d,mo,y]=m;if(y.length===2)y='20'+y;return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;}
    return '';
  };
  const pn=s=>s?String(s).replace(/[L,\s"']/g,''):'';
  const isD=s=>/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(String(s||'').trim())||/^\d{4}-\d{2}-\d{2}$/.test(String(s||'').trim());
  const kw={doc:['documento','doc','referencia','ref'],fecha:['fecha','date','pago'],
            valor:['valor','monto','importe','capital'],accion:['accion','acción','tipo','concepto']};
  let map=null,start=0;
  for(let i=0;i<Math.min(lines.length,3);i++){
    const cols=lines[i].split(sep).map(c=>c.trim().toLowerCase().replace(/["']/g,''));
    if(cols.some(isD)) continue;
    const m={};let n=0;
    cols.forEach((c,ci)=>{for(const[k,ks] of Object.entries(kw)){
      if(m[k]!==undefined) continue;
      if(ks.some(x=>c.includes(x))){m[k]=ci;n++;}}});
    if(n>=2){map=m;start=i+1;break;}
  }
  if(!map){
    const first=lines[0].split(sep).map(c=>c.trim().replace(/["']/g,''));
    map={};
    let dc=-1;first.forEach((v,i)=>{if(dc<0&&isD(v))dc=i;});
    let doc=-1;first.forEach((v,i)=>{if(doc<0&&/^[A-Za-z]{1,4}[-\s]?\d+$/.test(v))doc=i;});
    let vc=-1,best=-1;
    first.forEach((v,i)=>{
      if(i===dc||i===doc||isD(v)) return;
      const nv=parseFloat(pn(v));
      if(nv&&(v.includes('.')||nv>=100)&&nv>best){best=nv;vc=i;}
    });
    if(dc>=0)map.fecha=dc; if(doc>=0)map.doc=doc; if(vc>=0)map.valor=vc;
    if(map.fecha===undefined||map.valor===undefined) map={doc:1,fecha:2,valor:3,accion:4};
    start=0;
  }
  const rows=[];
  for(let i=start;i<lines.length;i++){
    const cols=lines[i].split(sep).map(c=>c.trim().replace(/^["']|["']$/g,''));
    if(cols.length<2) continue;
    const get=k=>map[k]!==undefined?(cols[map[k]]||''):'';
    let fecha=pd(get('fecha'));
    if(!fecha) for(const c of cols){const x=pd(c);if(x){fecha=x;break;}}
    let valor=parseFloat(pn(get('valor')))||0;
    if(!valor) for(const c of cols){if(isD(c))continue;const nv=parseFloat(pn(c));if(nv&&nv>valor)valor=nv;}
    if(!fecha&&!valor) continue;
    rows.push({doc:get('doc')||'',fecha,valor:valor||0});
  }
  if(!rows.length){toast('No se reconoció ningún pago','m');return;}
  rows.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
  // El N-ésimo pago corresponde a la N-ésima cuota, sin importar fechas.
  CUOTAS=rows.map((r,i)=>({num:i+1,doc:r.doc,valor:r.valor,pagada:r.fecha,pactada:CUOTAS[i]?.pactada||''}));
  $('#paste').value='';
  pintarCuotas();resultado();
  toast(`${rows.length} pago(s) cargados`,'k');
}
