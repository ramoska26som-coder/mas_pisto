function resultado(){
  const el=$('#res');if(!el)return;
  const its=ACT.checklist_analista?.referencias?.items||[];
  const falsa=its.find(r=>r.resultado==='falsa');
  if(falsa){el.innerHTML=resHTML({motivo_denegacion:`Referencia falsa: ${falsa.nombre}`,denegado_automaticamente:true});return;}
  const ing=ACT.analisis_ingresos?.ingreso_promedio;
  const lim=calcLimite(ing,ACT.tipo_operacion,mesesCliente(ACT));
  if(!lim.ok){el.innerHTML=resHTML({motivo_denegacion:lim.motivo});return;}
  const h=ACT.tipo_operacion==='nuevo'?null:analizarCuotas(CUOTAS);
  const t=calcTasa(ACT.tipo_operacion,ing,perfilRubro(ACT.datos_cliente?.rubro),mesesCliente(ACT),h);
  const sc=parseInt($('#cr-s')?.value);
  el.innerHTML=resHTML({monto_aprobado:lim.monto,tasa:t.tasa,categoria_tasa:t.tipoTasa,
    razon:`${lim.regla} · ${t.regla}${sc?` · Equifax ${sc} (${catEquifax(sc)})`:''}`});
}

/* Arma los valores del perfil en el MISMO orden del formulario de la empresa,
   para copiar y pegar en una columna de Excel (cada valor en su fila). */
function filasPerfilExcel(s){
  const d=s.datos_cliente||{}, ra=s.resultado_analisis||{}, ai=s.analisis_ingresos||{};
  const nac=d.nacimiento
    ? new Date(d.nacimiento+'T12:00:00').toLocaleDateString('es-HN')
    : (d.edad?`${d.edad} años`:'');
  const monto = ra.monto_aprobado || d.monto || '';
  const gana  = ai.ingreso_promedio || d.salario || '';
  const puesto = d.puesto || d.cargo || '';
  const rubro = d.rubro==='Otro'||d.rubro==='otro' ? (d.rubro_otro||d.rubro) : (d.rubro||'');
  const referente = d.canal_detalle || d.canal || d.canal_nombre || '';
  const domicilio = d.direccion_casa || d.direccion || '';
  const antiguedadCasa = d.tiempo_vivienda
    || [d.vivienda_anios?`${d.vivienda_anios} años`:'', d.vivienda_meses?`${d.vivienda_meses} meses`:''].filter(Boolean).join(' ');
  const vivienda = d.tipo_vivienda==='Alquilada'||d.tipo_vivienda==='alquila'
    ? `Alquila${d.tipo_alquiler?'/'+d.tipo_alquiler:''}`
    : (d.tipo_vivienda||'');
  const refs=(d.referencias&&d.referencias.length?d.referencias:[
      {nombre:d.ref1_nombre,telefono:d.ref1_tel,parentesco:d.ref1_parentesco},
      {nombre:d.ref2_nombre,telefono:d.ref2_tel,parentesco:d.ref2_parentesco}
    ]).filter(r=>r&&(r.nombre||r.telefono));
  const refsTxt = refs.map(r=>`${r.nombre||''}${r.telefono?' '+r.telefono:''}${r.parentesco?' · '+r.parentesco:''}`.trim()).join('\n');

  const fmtMonto=n=>n?('L '+Number(n).toLocaleString('es-HN')):'';
  // Orden EXACTO del formulario de la empresa
  return [
    d.nombre||'',
    d.cedula||'',
    fmtMonto(monto),
    nac,
    d.empresa||'',
    rubro,
    d.dir_empresa||d.direccion_trabajo||'',
    puesto,
    d.antiguedad||'',
    fmtMonto(gana),
    d.prestaciones||'',
    d.otros_ingresos||d.tiene_otros||'',
    d.metodo_pago||d.forma_pago||'',
    d.dias_pago||d.frecuencia_pago||'',
    d.destino||'',
    referente,
    d.telefono||'',
    domicilio,
    antiguedadCasa,
    vivienda,
    refsTxt
  ];
}

/* Copia los valores en una columna (un valor por línea = una celda por fila en Excel).
   Las referencias, que llevan varias líneas, van entre comillas para que Excel las
   mantenga en una sola celda al pegar. */
async function copiarPerfil(s){
  const filas=filasPerfilExcel(s);
  const texto=filas.map(v=>{
    v=String(v||'');
    // Si el valor tiene saltos de línea o tabs, se encierra en comillas (formato TSV)
    return /[\n\t"]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join('\n');
  try{
    await navigator.clipboard.writeText(texto);
    toast('Datos copiados · pegalos en Excel','k');
  }catch(e){
    // Respaldo para navegadores viejos o sin permiso de portapapeles
    const ta=document.createElement('textarea');
    ta.value=texto; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Datos copiados · pegalos en Excel','k'); }
    catch(_){ toast('No se pudo copiar automáticamente','m'); }
    ta.remove();
  }
}

/* El asesor transcribe el perfil, elige el tipo de desembolso y asigna verificador.
   Al "completar", valida todo y pasa a por_verificar. */
async function guardarPerfil(completar){
  const cod=$('#pf-codigo')?.value.trim()||'';
  const desemb=$('#pf-desemb')?.value||'';
  const verId=$('#pf-verif')?.value||'';
  const confirmado=$('#pf-confirmado')?.checked||false;

  const campos={
    perfil_sistema:{...(ACT.perfil_sistema||{}), codigo:cod, confirmado,
      confirmado_por:confirmado?YO.nombre:null,
      confirmado_en:confirmado?new Date().toISOString():null},
    tipo_desembolso:desemb||null
  };
  if(verId) campos.verificador_id=verId;

  if(!completar){ await guardar(campos); toast('Perfil guardado','k'); return; }

  // Validaciones antes de enviar a verificar
  if(!confirmado){ toast('Confirmá que transcribiste el perfil al sistema','m'); return; }
  if(!desemb){ toast('Elegí el tipo de desembolso','m'); return; }
  if(!verId){ toast('Asigná un verificador','m'); return; }
  await guardar({...campos,estado:'por_verificar'});
  toast('Perfil completo · enviada a verificar','k');
}

function datosAnalista(){
  const ck=JSON.parse(JSON.stringify(ACT.checklist_analista));
  const its=ck.referencias?.items||[];
  if(its.length&&its.every(r=>r.resultado)) ck.referencias.estado='realizado';
  const out={checklist_analista:ck,analista_id:YO.id};

  if(ACT.tipo_operacion==='nuevo'){
    out.comportamiento_pago={sin_historial:true,motivo:'Nuevo ingreso: sin historial previo'};
    out.checklist_analista.comportamiento_pago.estado='realizado';
  } else {
    const h=analizarCuotas(CUOTAS);
    out.comportamiento_pago={cuotas:CUOTAS,
      pagos:CUOTAS.filter(c=>c.pactada&&c.pagada),
      pagos_puntuales:h.ok,atrasos_leves:h.late,peor_atraso:h.maxDias,
      resultado:h.maxDias>=P.spDiasGrave?'con atrasos graves':(h.late?'con atrasos leves':'favorable')};
  }
  const sc=parseInt($('#cr-s')?.value)||null;
  if(sc) out.central_riesgo={score:sc,categoria:catEquifax(sc),
    observaciones:$('#cr-o')?.value.trim()||'',consultado_en:new Date().toISOString()};

  const ing=ACT.analisis_ingresos?.ingreso_promedio;
  const lim=calcLimite(ing,ACT.tipo_operacion,mesesCliente(ACT));
  if(lim.ok){
    const h=ACT.tipo_operacion==='nuevo'?null:analizarCuotas(CUOTAS);
    const t=calcTasa(ACT.tipo_operacion,ing,perfilRubro(ACT.datos_cliente?.rubro),mesesCliente(ACT),h);
    out.resultado_analisis={...ACT.resultado_analisis,monto_aprobado:lim.monto,tasa:t.tasa,
      categoria_tasa:t.tipoTasa,razon:`${lim.regla} · ${t.regla}`,calculado_en:new Date().toISOString()};
  }
  return out;
}

  await sb.rpc('agregar_nota',{p_id:ACT.id,p_texto:'Recepción de documentos confirmada.'});
  toast('Documentos confirmados','k');
  await cargar(); ACT=SOLS.find(s=>s.id===ACT.id)||ACT; detalle();
}

/* Cruce de datos: avisa si el teléfono, la cédula o el nombre de este cliente
   (o de sus referencias) ya aparecen en otra solicitud. Sirve para detectar
   solicitudes repetidas o a alguien que era referencia de un caso rechazado. */
async function pintarCoincidencias(){
  const box=$('#coinc-box'); if(!box||!ACT) return;
  const {data,error}=await sb.rpc('coincidencias_solicitud',{p_id:ACT.id});
  if(error||!data||!data.length){ box.innerHTML=''; return; }

  // Agrupo por la otra solicitud: una tarjeta por caso, con todas sus razones
  const g={};
  data.forEach(c=>{ (g[c.solicitud_id]=g[c.solicitud_id]||{info:c,razones:[]}).razones.push(c); });
  const casos=Object.values(g);
  const grave=casos.some(c=>c.razones.some(r=>r.riesgo==='alto'));
  const TIPO_R={cedula:'Misma cédula',telefono:'Mismo teléfono',nombre:'Mismo nombre'};

  box.innerHTML=`<div class="co-sec">
    <div class="co-h">
      <span style="font-size:17px">${grave?'🚩':'⚠️'}</span>
      <h4>${grave?'Coincidencias importantes':'Posibles coincidencias'}</h4>
      <span class="co-badge ${grave?'co-alto':'co-medio'}">${casos.length} caso${casos.length>1?'s':''}</span>
    </div>
    <div class="co-sub">Estos datos ya aparecen en otras solicitudes. Revisá antes de continuar.</div>
    ${casos.map(c=>{
      const i=c.info;
      const cerr=['aprobado','denegado','desembolsado','cancelado'].includes(i.estado);
      const cl={aprobado:'k',denegado:'m',desembolsado:'k',cancelado:'p'}[i.estado]||'a';
      const peor=c.razones.some(r=>r.riesgo==='alto')?'alto'
                :c.razones.some(r=>r.riesgo==='medio')?'medio':'bajo';
      return `<div class="co-item" data-ir="${i.solicitud_id}">
        <div class="co-top">
          <span class="co-nom">${esc(i.nombre)}</span>
          <span class="co-badge co-${peor}">${peor==='alto'?'riesgo alto':peor==='medio'?'revisar':'leve'}</span>
          <span class="badge ${cl}" style="margin:0">${ETQ[i.estado]||i.estado}</span>
        </div>
        <div style="font-size:12px;color:var(--gris)">${esc(i.folio)} · ${fechaHora(i.creado_en)}</div>
        ${c.razones.map(r=>`<div class="co-razon">
          <span>•</span><div><b>${TIPO_R[r.tipo]||r.tipo}</b> (${esc(r.valor)}) —
          acá es <b>${esc(r.donde_aqui)}</b>, allá es <b>${esc(r.donde_alla)}</b>.</div></div>`).join('')}
        ${i.estado==='denegado'&&i.motivo?`<div class="co-mot">Fue rechazada: ${esc(i.motivo)}</div>`:''}
      </div>`;
    }).join('')}
  </div>`;

  box.querySelectorAll('[data-ir]').forEach(el=>el.addEventListener('click',()=>{
    const otra=SOLS.find(s=>s.id===el.dataset.ir);
    if(otra) abrir(otra.id);
    else toast('Esa solicitud no está en tu lista visible','m');
  }));
}

async function guardar(campos){
  const bs=$$('#m-pie .btn');bs.forEach(b=>b.disabled=true);
  const {error}=await sb.from('solicitudes').update(campos).eq('id',ACT.id);
  if(error){toast(traducir(error.message),'m');bs.forEach(b=>b.disabled=false);return;}
  toast('Guardado','k');
  await cargar();
  const a=SOLS.find(s=>s.id===ACT.id);
  if(a&&a.estado!==ACT.estado) cerrarModalNav();
  else if(a){ACT=a;CUOTAS=a.comportamiento_pago?.cuotas||CUOTAS;detalle();}
}
function traducir(m){
  if(m.includes('comportamiento de pago')) return 'Falta completar el comportamiento de pago.';
  if(m.includes('referencias')) return 'Faltan referencias por llamar.';
  if(m.includes('ingresos')) return 'Falta capturar los ingresos del cliente.';
  if(m.includes('fecha de ingreso')) return 'Un reingreso necesita la fecha de ingreso del cliente.';
  if(m.includes('analista')) return 'Debe asignarse un analista.';
  if(m.includes('verificador')) return 'Debe asignarse un verificador.';
  if(m.includes('row-level security')) return 'No tenés permiso para esta acción.';
  return m;
}
async function aprobar(){
  const r=ACT.resultado_analisis||{};
  if(!r.monto_aprobado){toast('Falta calcular el monto','m');return;}
  if(!confirm(`¿Aprobar L${fmt(r.monto_aprobado)} al ${r.tasa}%?`)) return;
  await guardar({estado:'aprobado'});
}
async function denegar(){
  const m=prompt('¿Por qué se deniega?');
  if(!m) return;
  await guardar({estado:'denegado',resultado_analisis:{...ACT.resultado_analisis,motivo_denegacion:m}});
}

(async function(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await arrancar(session);
})();
</script>
